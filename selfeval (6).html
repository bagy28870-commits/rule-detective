<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>규칙 탐정 - AI 자기평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F8FF;
    --card:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5A6785;
    --primary:#4C5FD5;
    --primary-ink:#FFFFFF;
    --success:#21B37C;
    --warn:#F5A623;
    --hard:#7C8DE0;
    --fail:#E8574A;
    --border:#DCE3F5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141826; --card:#1E2436; --ink:#EDF1FF; --ink-soft:#AEB8D6; --border:#2C3352;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141826; --card:#1E2436; --ink:#EDF1FF; --ink-soft:#AEB8D6; --border:#2C3352;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  .display{font-family:'Jua', sans-serif; letter-spacing:0.5px;}
  /* 화면 가운데에 크게: 세로는 가운데 정렬, 큰 화면(전자칠판·PC)에서는 전체를 확대 */
  #app{
    --z:1; zoom:var(--z);
    max-width:1100px; margin:0 auto; padding:24px 16px 40px;
    min-height:calc(100vh / var(--z));
    display:flex; flex-direction:column; justify-content:center;
  }
  /* 배율(--z)은 아래 fit() 스크립트가 화면 크기에 맞춰 자동으로 정해요 (스크롤 없이 한 화면에 보이게) */
  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none; color:var(--ink);}

  /* ---- 역할 선택 ---- */
  .hero{text-align:center; padding:30px 10px 10px;}
  .hero .glass{font-size:56px;}
  .hero h1{font-size:clamp(26px,5vw,38px); margin:8px 0 4px;}
  .hero p{color:var(--ink-soft); margin:0 0 26px; font-size:16px;}
  .role-grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); max-width:820px; margin:0 auto;}
  .role-card{
    background:var(--card); border:3px solid var(--border); border-radius:22px;
    padding:26px 18px; text-align:center; transition:transform .15s ease;
  }
  .role-card:active{transform:scale(0.97);}
  .role-card .badge{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-family:'Jua',sans-serif;}
  .role-card h3{margin:4px 0 2px; font-size:20px;}
  .role-card p{margin:0; color:var(--ink-soft); font-size:13px;}
  .role-card.teacher, .role-card.other{border-style:dashed;}

  /* ---- 학생 화면 ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
  .topbar .who{display:flex; align-items:center; gap:10px;}
  .who .dot{width:16px;height:16px;border-radius:50%;}
  .topbar h2{margin:0; font-size:22px;}
  .pins{display:flex; gap:8px;}
  .pins span{width:14px;height:14px;border-radius:50%;background:var(--border);}
  .pins span.done{background:var(--success);}
  .pins span.now{background:var(--primary); box-shadow:0 0 0 4px rgba(76,95,213,.25);}
  .conn-badge{display:block; font-size:12px; margin:0 0 12px; padding:2px;}
  .conn-ok{color:var(--success);}
  .conn-wait{color:var(--ink-soft);}
  .conn-bad{color:var(--fail); font-weight:bold;}

  .q-card{
    background:var(--card); border-radius:26px; padding:30px 22px 26px; border:2px dashed var(--border);
    text-align:center; margin-bottom:22px;
  }
  .q-tag{
    display:inline-block; padding:6px 18px; border-radius:999px; background:var(--bg);
    border:2px solid var(--border); font-size:15px; color:var(--ink-soft); margin-bottom:16px;
  }
  .q-text{font-size:clamp(24px,4.2vw,34px); line-height:1.45; margin:0 0 8px;}
  .q-sub{font-size:clamp(20px,3.4vw,28px); line-height:1.45; margin:0 0 6px; color:var(--ink);}
  .q-hint{font-size:16px; color:var(--ink-soft); margin:12px 0 0;}
  .voice-btn{
    background:var(--warn); border:none; border-radius:50%; width:48px; height:48px;
    font-size:22px; margin-top:14px; box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .voice-btn:active{transform:scale(0.92);}

  .ans-row{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  .ans{
    background:var(--card); border:4px solid var(--border); border-radius:26px;
    padding:22px 12px; min-height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .ans:active{transform:scale(0.97);}
  .ans .em{font-size:64px; line-height:1;}
  .ans .lb{font-size:clamp(20px,3vw,26px); font-weight:bold;}
  .ans.sel{border-color:var(--primary); background:rgba(76,95,213,.12); box-shadow:0 0 0 5px rgba(76,95,213,.22);}
  .ans.good.sel{border-color:var(--success); background:rgba(33,179,124,.13); box-shadow:0 0 0 5px rgba(33,179,124,.25);}
  .ans.some.sel{border-color:var(--warn); background:rgba(245,166,35,.15); box-shadow:0 0 0 5px rgba(245,166,35,.28);}
  .ans.hard.sel{border-color:var(--hard); background:rgba(124,141,224,.15); box-shadow:0 0 0 5px rgba(124,141,224,.28);}
  .ans-row.five{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .ans-row.five .ans{min-height:140px;}
  .ans-row.five .ans .em{font-size:52px;}
  .ans.multi{position:relative;}
  .ans.multi .check{
    position:absolute; top:8px; right:10px; width:30px; height:30px; border-radius:50%;
    background:var(--primary); color:#fff; font-size:18px; display:none; align-items:center; justify-content:center;
  }
  .ans.multi.sel .check{display:flex;}
  .ans .sub{font-size:15px; color:var(--ink-soft);}

  .cta-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px;}
  .cta{
    padding:16px 32px; border-radius:18px; border:none; background:var(--primary); color:var(--primary-ink);
    font-size:20px; font-weight:bold;
  }
  .cta.secondary{background:var(--card); color:var(--ink); border:2px solid var(--border);}
  .cta.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border); font-size:15px; padding:10px 18px;}
  .cta:disabled{opacity:.4;}
  .need{color:var(--ink-soft); font-size:15px; text-align:center; min-height:22px; margin-top:12px;}

  /* ---- 마무리 ---- */
  .finish{text-align:center; padding:20px 6px;}
  .finish .big{font-size:72px;}
  .finish h2{font-size:clamp(28px,5vw,40px); margin:6px 0 14px;}
  .summary{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:18px 0;}
  .chip{
    background:var(--card); border:2px solid var(--border); border-radius:999px; padding:9px 18px; font-size:18px;
  }
  .fb-card{
    background:var(--card); border:3px solid var(--success); border-radius:22px; padding:20px 22px;
    max-width:640px; margin:0 auto; text-align:left; font-size:clamp(19px,3vw,24px); line-height:1.6;
  }
  .fb-card p{margin:6px 0;}
  .fb-label{font-family:'Jua',sans-serif; color:var(--success); font-size:15px; margin-bottom:4px; display:block;}

  /* ---- 교사 현황판 ---- */
  .dash-head{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .dash-head p{color:var(--ink-soft); margin:2px 0 0;}
  .dash-grid{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .stu-card{background:var(--card); border-radius:20px; overflow:hidden; border:2px solid var(--border);}
  .stu-tab{padding:14px 18px; color:#fff; display:flex; justify-content:space-between; align-items:center;}
  .stu-tab .name{font-family:'Jua',sans-serif; font-size:20px;}
  .stu-tab .state{font-size:13px; background:rgba(255,255,255,.25); padding:4px 12px; border-radius:999px;}
  .stu-body{padding:16px 18px 18px;}
  .row{margin-bottom:14px;}
  .row .tag{font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; display:block;}
  .row .val{font-size:18px; font-weight:bold;}
  .val.none{color:var(--ink-soft); font-weight:normal; font-size:15px;}
  .val.good{color:var(--success);} .val.some{color:#C97A12;} .val.hard{color:var(--hard);}
  .mini-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .mini-chips span{background:var(--bg); border:2px solid var(--border); border-radius:999px; padding:4px 12px; font-size:15px;}
  .mini-chips span.fix{border-color:var(--success); background:rgba(33,179,124,.12);}
  .time{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .back-link{align-self:flex-start; background:none;border:none;color:var(--ink-soft);font-size:14px;margin-bottom:10px;padding:0;}
  .empty-note{color:var(--ink-soft); font-size:14px; text-align:center; padding:6px 4px;}
  .banner-help{
    background:rgba(232,87,74,.12); border:1.5px solid var(--fail); border-radius:12px; padding:10px 14px;
    font-size:14px; margin:10px 0;
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* ===== 지도안 6번 '학생 성찰 문항'과 같은 내용 ===== */
  var GOALS = {
    good: {em:'😊', label:'잘 했어요',        cls:'good'},
    some: {em:'😐', label:'조금 할 수 있어요', cls:'some'},
    hard: {em:'😔', label:'어려웠어요',        cls:'hard'}
  };
  var GOAL_KEYS = ['good','some','hard'];
  var GOAL_FIELD = ['goalFind','goalMake'];   // 0번·1번 문항이 저장되는 칸
  var TOTAL = 4;                              // 전체 문항 수

  var STRATS = [
    {k:'point',  em:'👆',  label:'짚어보기'},
    {k:'speak',  em:'🗣️', label:'말해보기'},
    {k:'reread', em:'🔁',  label:'다시보기'},
    {k:'group',  em:'🔗',  label:'묶어보기'},
    {k:'help',   em:'🙋',  label:'도움받기'}
  ];

  var NEXTS = {
    today:     {em:'⭐', label:'오늘 만든 규칙',   sub:'오늘 만든 규칙을 더 멋지게'},
    challenge: {em:'⬆️', label:'한 단계 도전 규칙', sub:'조금 더 어려운 규칙에 도전'}
  };

  var Q = [
    {tag:'1. 목표 확인 ①',
     main:'나는 무늬에서 반복되는 규칙을 찾아 말할 수 있었나요?',
     sub:'',
     speak:'나는 무늬에서 반복되는 규칙을 찾아 말할 수 있었나요?'},
    {tag:'1. 목표 확인 ②',
     main:'내가 고른 규칙으로 무늬를 만들 수 있었나요?',
     sub:'',
     speak:'내가 고른 규칙으로 무늬를 만들 수 있었나요?'},
    {tag:'2. 전략 성찰',
     main:'규칙을 찾거나 만들 때 어떤 방법을 사용했나요?',
     sub:'',
     hint:'여러 개를 골라도 돼요',
     speak:'규칙을 찾거나 만들 때 어떤 방법을 사용했나요? 여러 개를 골라도 돼요.'},
    {tag:'3. 다음 계획',
     main:'다음에 도전하고 싶은 규칙은 무엇인가요?',
     sub:'',
     speak:'다음에 도전하고 싶은 규칙은 무엇인가요?'}
  ];

  /* ===== 학생 명단 (활동3 앱과 같은 id를 사용) ===== */
  var ROSTER = [
    {id:'seoyeon', name:'송서연', accent:'#2EC4B6'},
    {id:'yichan',  name:'최이찬', accent:'#4C5FD5'},
    {id:'yongjun', name:'이용준', accent:'#E8574A'}
  ];
  var OTHER_ACCENT = '#8B5FBF';

  var app = document.getElementById('app');
  var db = fbDb;
  var dbStatus = db ? 'checking' : 'no-db';
  var lastErr = '';           // 저장·읽기 실패 때 오류 종류(예: PERMISSION_DENIED)
  var S = null;               // 지금 평가 중인 학생 상태
  var teacherUnsub = null;
  var teacherCache = {};

  /* ===== 공용 도구 ===== */
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function sanitizeKey(str){ return String(str).replace(/[.#$\[\]\/\s]/g,'') || 'friend'; }

  /* 가장 자연스러운 한국어 음성 고르기 (기기에 설치된 음성 중 우선순위: Natural/Online > Google > 기타 한국어) */
  var KO_VOICE = null;
  function pickKoVoice(){
    try{
      var vs = (window.speechSynthesis.getVoices() || []).filter(function(v){
        return /^ko/i.test(String(v.lang).replace('_','-'));
      });
      if(!vs.length) return null;
      var prefs = [/natural|online/i, /google/i, /sun-?hi|yuna|heami|seoyeon|jian|flo/i];
      for(var i=0;i<prefs.length;i++){
        for(var j=0;j<vs.length;j++){ if(prefs[i].test(vs[j].name)) return vs[j]; }
      }
      return vs[0];
    }catch(e){ return null; }
  }
  try{
    if('speechSynthesis' in window){
      KO_VOICE = pickKoVoice();
      window.speechSynthesis.onvoiceschanged = function(){ KO_VOICE = pickKoVoice(); };
    }
  }catch(e){}

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      if(!KO_VOICE) KO_VOICE = pickKoVoice();
      if(KO_VOICE) u.voice = KO_VOICE;
      u.rate = 0.9; u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function statusBadge(){
    if(dbStatus === 'connected')    return '<span class="conn-badge conn-ok">🟢 선생님 화면과 연결됨</span>';
    if(dbStatus === 'checking')     return '<span class="conn-badge conn-wait">🟡 연결 확인 중…</span>';
    if(dbStatus === 'write-failed') return '<span class="conn-badge conn-bad">🔴 저장 실패'+(lastErr==='PERMISSION_DENIED' ? ' — 선생님께 알려 주세요(저장 권한 없음)' : ' — 인터넷 연결을 확인해 주세요')+(lastErr?' ['+esc(lastErr)+']':'')+'</span>';
    if(dbStatus === 'no-db')        return '<span class="conn-badge conn-bad">🔴 연결 도구를 불러오지 못했어요 — 인터넷을 확인하고 새로고침 해 주세요</span>';
    return '<span class="conn-badge conn-bad">🔴 선생님 화면과 연결 안 됨 — 인터넷(와이파이)을 확인해 주세요</span>';
  }
  function refreshBadge(){
    var el = document.getElementById('badge-slot');
    if(el) el.innerHTML = statusBadge();
  }

  function fmtTime(ts){
    if(!ts) return '';
    var d = new Date(ts);
    var h = d.getHours(), m = d.getMinutes();
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }

  init();
  function init(){
    renderRoleSelect();
  }

  /* ================= 역할 선택 ================= */
  function renderRoleSelect(){
    app.removeAttribute('data-view');
    leaveTeacher();
    S = null;
    var cards = '';
    ROSTER.forEach(function(r, i){
      cards +=
        '<div class="role-card" id="pick-'+r.id+'" role="button" tabindex="0">'+
          '<div class="badge" style="background:'+r.accent+'">'+(i+1)+'</div>'+
          '<h3>'+esc(r.name)+'</h3><p>자기평가 시작하기</p>'+
        '</div>';
    });
    app.innerHTML =
      '<div class="hero">'+
        '<div class="glass">📝</div>'+
        '<h1 class="display">AI 자기평가</h1>'+
        '<p>누가 사용하는 화면인가요?</p>'+
      '</div>'+
      '<div class="role-grid">'+ cards +
        '<div class="role-card other" id="pick-other" role="button" tabindex="0">'+
          '<div class="badge" style="background:'+OTHER_ACCENT+'">➕</div>'+
          '<h3>그 외 친구</h3><p>이름 입력하고 참여하기</p>'+
        '</div>'+
        '<div class="role-card teacher" id="pick-teacher" role="button" tabindex="0">'+
          '<div class="badge" style="background:var(--ink-soft)">🖥️</div>'+
          '<h3>교사용 전자칠판</h3><p>실시간 현황판 보기</p>'+
        '</div>'+
      '</div>';

    ROSTER.forEach(function(r){
      bindClick('pick-'+r.id, function(){ startStudent(r.id, r.name, r.accent); });
    });
    bindClick('pick-other', renderOtherName);
    bindClick('pick-teacher', renderTeacher);
  }

  function bindClick(id, fn){
    var el = document.getElementById(id);
    if(!el) return;
    el.onclick = fn;
    el.onkeydown = function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fn(); } };
  }

  function renderOtherName(){
    app.innerHTML =
      '<div class="hero"><div class="glass">✍️</div>'+
        '<h1 class="display">이름을 알려주세요</h1>'+
        '<p>입력한 이름이 선생님 화면에 표시돼요</p></div>'+
      '<div style="max-width:420px;margin:0 auto;text-align:center;">'+
        '<input id="other-name" type="text" maxlength="10" placeholder="이름을 입력하세요" '+
          'style="width:100%;padding:16px;border-radius:16px;border:3px solid var(--border);font-size:22px;'+
          'text-align:center;font-family:inherit;background:var(--card);color:var(--ink);">'+
        '<div class="need" id="other-err" style="color:var(--fail);"></div>'+
        '<div class="cta-row"><button class="cta" id="other-go">시작하기</button></div>'+
        '<div class="cta-row"><button class="cta ghost" id="other-back">← 처음으로</button></div>'+
      '</div>';
    document.getElementById('other-back').onclick = renderRoleSelect;
    document.getElementById('other-go').onclick = submitOther;
    document.getElementById('other-name').addEventListener('keydown', function(e){
      if(e.key === 'Enter') submitOther();
    });
  }
  function submitOther(){
    var name = (document.getElementById('other-name').value || '').trim();
    if(!name){ document.getElementById('other-err').textContent = '이름을 입력해 주세요'; return; }
    var id = 'other_' + sanitizeKey(name) + '_' + Date.now().toString(36).slice(-4);
    startStudent(id, name, OTHER_ACCENT);
  }

  /* ================= 학생 평가 흐름 ================= */
  function startStudent(id, name, accent){
    S = {id:id, name:name, accent:accent, step:0, goalFind:null, goalMake:null, strategies:[], next:null, done:false};
    saveState();
    renderQuestion(0);
  }

  function saveState(){
    if(!db || !S) return;
    var data = {
      name: S.name,
      step: S.step,
      done: !!S.done,
      goalFind: S.goalFind || null,
      goalMake: S.goalMake || null,
      strategies: S.strategies.slice(),
      next: S.next || null,
      updatedAt: Date.now()
    };
    if(S.done) data.doneAt = S.doneAt || Date.now();
    try{
      db.ref('selfeval/'+S.id).set(data).then(function(){
        dbStatus = 'connected'; refreshBadge();
      }).catch(function(err){
        lastErr = (err && (err.code || err.message)) || 'ERROR';
        dbStatus = 'write-failed'; refreshBadge();
      });
    }catch(e){ lastErr = (e && e.message) || 'ERROR'; dbStatus = 'write-failed'; refreshBadge(); }
  }

  function pinsHtml(cur){
    var h = '<div class="pins" aria-label="진행 상황">';
    for(var i=0;i<TOTAL;i++){
      h += '<span class="'+(i<cur?'done':(i===cur?'now':''))+'"></span>';
    }
    return h + '</div>';
  }

  function topbar(cur){
    return '<div class="topbar">'+
      '<div class="who"><span class="dot" style="background:'+S.accent+'"></span><h2 class="display">'+esc(S.name)+'</h2></div>'+
      pinsHtml(cur)+
    '</div><div id="badge-slot">'+statusBadge()+'</div>';
  }

  function questionCard(q){
    return '<div class="q-card">'+
      '<span class="q-tag">'+q.tag+'</span>'+
      '<p class="q-text display">'+esc(q.main)+'</p>'+
      (q.sub ? '<p class="q-sub display">'+esc(q.sub)+'</p>' : '')+
      (q.hint ? '<p class="q-hint">'+esc(q.hint)+'</p>' : '')+
      '<button class="voice-btn" id="voice" aria-label="질문 듣기">🔊</button>'+
    '</div>';
  }

  function renderQuestion(step){
    S.step = step;
    var q = Q[step];
    var html = topbar(step) + questionCard(q);

    if(step <= 1){
      var cur = S[GOAL_FIELD[step]];
      html += '<div class="ans-row" id="answers">';
      GOAL_KEYS.forEach(function(k){
        var g = GOALS[k];
        html += '<button class="ans '+g.cls+(cur===k?' sel':'')+'" data-k="'+k+'" aria-pressed="'+(cur===k)+'">'+
          '<span class="em">'+g.em+'</span><span class="lb">'+g.label+'</span></button>';
      });
      html += '</div>';
      if(step === 1) html += '<div class="cta-row"><button class="cta secondary" id="prev">← 이전</button></div>';
    } else if(step === 2){
      html += '<div class="ans-row five" id="answers">';
      STRATS.forEach(function(s){
        var on = S.strategies.indexOf(s.k) !== -1;
        html += '<button class="ans multi'+(on?' sel':'')+'" data-k="'+s.k+'" aria-pressed="'+on+'">'+
          '<span class="check">✓</span><span class="em">'+s.em+'</span><span class="lb">'+s.label+'</span></button>';
      });
      html += '</div>'+
        '<div class="need" id="need"></div>'+
        '<div class="cta-row">'+
          '<button class="cta secondary" id="prev">← 이전</button>'+
          '<button class="cta" id="next">다 골랐어요</button>'+
        '</div>';
    } else {
      html += '<div class="ans-row" id="answers">';
      ['today','challenge'].forEach(function(k){
        var n = NEXTS[k];
        html += '<button class="ans'+(S.next===k?' sel':'')+'" data-k="'+k+'" aria-pressed="'+(S.next===k)+'">'+
          '<span class="em">'+n.em+'</span><span class="lb">'+n.label+'</span><span class="sub">'+n.sub+'</span></button>';
      });
      html += '</div>'+
        '<div class="cta-row"><button class="cta secondary" id="prev">← 이전</button></div>';
    }

    app.innerHTML = html;
    document.getElementById('voice').onclick = function(){ speak(q.speak); };

    var answers = document.getElementById('answers');
    answers.onclick = function(e){
      var btn = e.target.closest('.ans');
      if(!btn) return;
      onAnswer(step, btn.getAttribute('data-k'), btn);
    };
    var prev = document.getElementById('prev');
    if(prev) prev.onclick = function(){ renderQuestion(step-1); };
    var nextBtn = document.getElementById('next');
    if(nextBtn) nextBtn.onclick = function(){
      if(S.strategies.length === 0){
        document.getElementById('need').textContent = '하나 이상 골라 주세요 👆';
        return;
      }
      saveState();
      renderQuestion(3);
    };
  }

  function onAnswer(step, key, btn){
    if(step <= 1){
      S[GOAL_FIELD[step]] = key;
      markSelected(btn);
      saveState();
      setTimeout(function(){ if(S && S.step === step) renderQuestion(step+1); }, 450);
    } else if(step === 2){
      var i = S.strategies.indexOf(key);
      if(i === -1) S.strategies.push(key); else S.strategies.splice(i,1);
      var on = S.strategies.indexOf(key) !== -1;
      btn.classList.toggle('sel', on);
      btn.setAttribute('aria-pressed', on);
      var need = document.getElementById('need');
      if(need) need.textContent = '';
      saveState();
    } else {
      S.next = key;
      markSelected(btn);
      S.done = true; S.doneAt = Date.now();
      saveState();
      setTimeout(function(){ if(S && S.step === 3) renderFinish(); }, 450);
    }
  }

  function markSelected(btn){
    var all = btn.parentNode.querySelectorAll('.ans');
    for(var i=0;i<all.length;i++){ all[i].classList.remove('sel'); all[i].setAttribute('aria-pressed','false'); }
    btn.classList.add('sel'); btn.setAttribute('aria-pressed','true');
  }

  /* ================= 마무리: 규칙에 따른 맞춤 격려 ================= */
  function stratLabels(keys){
    var out = [];
    STRATS.forEach(function(s){ if(keys.indexOf(s.k) !== -1) out.push(s.label); });
    return out;
  }

  function buildFeedback(st){
    var lines = [];
    if(st.goalFind === 'good'){
      lines.push('무늬에서 규칙을 잘 찾아 말했군요. 멋져요!');
    } else if(st.goalFind === 'some'){
      lines.push('규칙을 찾아 말하는 것을 조금 해냈어요. 연습하면 더 잘할 수 있어요.');
    } else if(st.goalFind === 'hard'){
      lines.push('규칙 찾아 말하기가 어려웠군요. 솔직하게 말해 줘서 고마워요.');
    }
    if(st.goalMake === 'good'){
      lines.push('내가 고른 규칙으로 무늬도 잘 만들었어요!');
    } else if(st.goalMake === 'some'){
      lines.push('무늬 만들기도 조금 해냈어요. 한 번 더 해 보면 더 잘할 수 있어요.');
    } else if(st.goalMake === 'hard'){
      lines.push('무늬 만들기가 어려웠군요. 다음에 선생님과 천천히 같이 해 봐요.');
    }
    var s = st.strategies || [];
    if(s.indexOf('group') !== -1){
      lines.push('반복되는 묶음을 찾아본 것이 정말 대단해요!');
    } else if(s.indexOf('help') !== -1){
      lines.push('도움을 청한 것도 좋은 방법이에요.');
    } else if(s.length){
      lines.push(stratLabels(s).join(', ') + '(으)로 해냈네요.');
    }
    if(st.next === 'challenge'){
      lines.push('한 단계 도전을 골랐네요. 용기가 멋져요!');
    } else if(st.next === 'today'){
      lines.push('다음에도 오늘 만든 규칙을 더 멋지게 만들어 봐요.');
    }
    return lines;
  }

  function renderFinish(){
    S.step = TOTAL;
    var lines = buildFeedback(S);
    var chips = '';
    if(S.goalFind) chips += '<span class="chip">찾기 '+GOALS[S.goalFind].em+' '+GOALS[S.goalFind].label+'</span>';
    if(S.goalMake) chips += '<span class="chip">만들기 '+GOALS[S.goalMake].em+' '+GOALS[S.goalMake].label+'</span>';
    stratLabels(S.strategies).forEach(function(l){
      var em = ''; STRATS.forEach(function(s){ if(s.label === l) em = s.em; });
      chips += '<span class="chip">'+em+' '+l+'</span>';
    });
    if(S.next) chips += '<span class="chip">'+NEXTS[S.next].em+' '+NEXTS[S.next].label+'</span>';

    var fb = '';
    lines.forEach(function(l){ fb += '<p>'+esc(l)+'</p>'; });

    app.innerHTML =
      '<div class="topbar"><div class="who"><span class="dot" style="background:'+S.accent+'"></span>'+
        '<h2 class="display">'+esc(S.name)+'</h2></div>'+pinsHtml(TOTAL)+'</div>'+
      '<div id="badge-slot">'+statusBadge()+'</div>'+
      '<div class="finish">'+
        '<div class="big">🎉</div>'+
        '<h2 class="display">자기평가를 마쳤어요!</h2>'+
        '<div class="summary">'+chips+'</div>'+
        '<div class="fb-card"><span class="fb-label">AI 규칙 탐정의 한마디</span>'+fb+'</div>'+
        '<button class="voice-btn" id="voice" aria-label="격려 듣기">🔊</button>'+
        '<div class="cta-row">'+
          '<button class="cta secondary" id="edit">← 답 고치기</button>'+
          '<button class="cta ghost" id="home">처음으로</button>'+
        '</div>'+
      '</div>';
    document.getElementById('voice').onclick = function(){ speak(S.name + ', ' + lines.join(' ')); };
    document.getElementById('edit').onclick = function(){ S.done = false; saveState(); renderQuestion(0); };
    document.getElementById('home').onclick = renderRoleSelect;
  }

  /* ================= 교사 실시간 현황판 ================= */
  function leaveTeacher(){
    if(teacherUnsub){ try{ teacherUnsub(); }catch(e){} teacherUnsub = null; }
  }

  function renderTeacher(){
    app.setAttribute('data-view','teacher');
    leaveTeacher();
    teacherCache = {};
    app.innerHTML =
      '<button class="back-link" id="back">← 역할 선택으로</button>'+
      '<div class="dash-head">'+
        '<div><h1 class="display" style="margin:0;">📝 자기평가 실시간 현황판</h1>'+
        '<p>친구들이 누르는 답이 바로 나타나요</p></div>'+
        '<button class="cta ghost" id="clear">기록 지우기</button>'+
      '</div>'+
      '<div id="t-banner"></div>'+
      '<div class="dash-grid" id="grid"></div>';
    document.getElementById('back').onclick = renderRoleSelect;
    document.getElementById('clear').onclick = function(){
      if(!db) return;
      if(window.confirm('자기평가 기록을 모두 지울까요? 연습 후 새로 시작할 때 쓰세요.')){
        db.ref('selfeval').remove();
      }
    };
    drawGrid();

    if(!db){
      document.getElementById('t-banner').innerHTML =
        '<div class="banner-help">⚠️ 실시간 연결이 안 되어 있어요. 인터넷 연결을 확인해 주세요.</div>';
      return;
    }
    var ref = db.ref('selfeval');
    var cb = function(snap){
      teacherCache = snap.exists() ? (snap.val() || {}) : {};
      drawGrid();
    };
    ref.on('value', cb, function(err){
      var b = document.getElementById('t-banner');
      var code = (err && (err.code || err.message)) || '';
      if(b) b.innerHTML = '<div class="banner-help">⚠️ 기록을 읽지 못했어요'+(code?' ['+esc(code)+']':'')+
        '. Firebase 콘솔 → Realtime Database → 규칙에서 selfeval 경로의 읽기·쓰기가 열려 있는지 확인해 주세요.</div>';
    });
    teacherUnsub = function(){ ref.off('value', cb); };
  }

  function stateLabel(d){
    if(!d) return '아직 시작 전';
    if(d.done) return '✅ 완료 ' + fmtTime(d.doneAt);
    var n = d.step || 0;
    return '진행 중 ' + Math.min(n+1,TOTAL) + '/' + TOTAL;
  }

  function cardHtml(name, accent, d){
    var goal = '<span class="val none">아직 답하지 않았어요</span>';
    var make = '<span class="val none">아직 답하지 않았어요</span>';
    var strat = '<span class="val none">아직 답하지 않았어요</span>';
    var next = '<span class="val none">아직 답하지 않았어요</span>';
    if(d && d.goalFind && GOALS[d.goalFind]){
      goal = '<span class="val '+GOALS[d.goalFind].cls+'">'+GOALS[d.goalFind].em+' '+GOALS[d.goalFind].label+'</span>';
    }
    if(d && d.goalMake && GOALS[d.goalMake]){
      make = '<span class="val '+GOALS[d.goalMake].cls+'">'+GOALS[d.goalMake].em+' '+GOALS[d.goalMake].label+'</span>';
    }
    if(d && d.strategies && d.strategies.length){
      var c = '<div class="mini-chips">';
      STRATS.forEach(function(s){
        if(d.strategies.indexOf(s.k) !== -1) c += '<span class="'+(s.k==='group'?'fix':'')+'">'+s.em+' '+s.label+'</span>';
      });
      strat = c + '</div>';
    }
    if(d && d.next && NEXTS[d.next]){
      next = '<span class="val">'+NEXTS[d.next].em+' '+NEXTS[d.next].label+'</span>';
    }
    return '<div class="stu-card">'+
      '<div class="stu-tab" style="background:'+accent+'"><span class="name">'+esc(name)+'</span>'+
        '<span class="state">'+stateLabel(d)+'</span></div>'+
      '<div class="stu-body">'+
        '<div class="row"><span class="tag">1-①. 규칙을 찾아 말하기</span>'+goal+'</div>'+
        '<div class="row"><span class="tag">1-②. 고른 규칙으로 무늬 만들기</span>'+make+'</div>'+
        '<div class="row"><span class="tag">2. 사용한 방법</span>'+strat+'</div>'+
        '<div class="row"><span class="tag">3. 다음에 도전하고 싶은 규칙</span>'+next+'</div>'+
        (d && d.updatedAt ? '<div class="time">마지막 기록 '+fmtTime(d.updatedAt)+'</div>' : '')+
      '</div></div>';
  }

  function drawGrid(){
    var grid = document.getElementById('grid');
    if(!grid) return;
    var html = '';
    var seen = {};
    ROSTER.forEach(function(r){
      seen[r.id] = true;
      html += cardHtml(r.name, r.accent, teacherCache[r.id]);
    });
    var others = [];
    Object.keys(teacherCache).forEach(function(id){
      if(!seen[id] && teacherCache[id] && typeof teacherCache[id] === 'object') others.push(id);
    });
    others.sort(function(a,b){ return (teacherCache[a].updatedAt||0) - (teacherCache[b].updatedAt||0); });
    others.forEach(function(id){
      html += cardHtml(teacherCache[id].name || id, OTHER_ACCENT, teacherCache[id]);
    });
    grid.innerHTML = html;
  }

  /* ===== 한 화면에 맞추기: 내용 높이를 재서 스크롤 없이 가장 크게 ===== */
  var fitQueued = false;
  function fit(){
    fitQueued = false;
    var vw = window.innerWidth, vh = window.innerHeight;
    app.style.setProperty('--z', '1');
    app.style.minHeight = '0';
    var h = app.offsetHeight || 1;          // 배율 1일 때 내용 높이
    app.style.minHeight = '';
    var zW = vw >= 1100 ? vw / 1100 : 1;    // 가로로 더 커질 수 있는 한계
    var z = Math.min(vh / h, zW, 2.2);
    if(z < 0.6) z = 0.6;                     // 너무 작아져서 읽기 어려워지는 것 방지
    app.style.setProperty('--z', String(Math.floor(z * 100) / 100));
  }
  function queueFit(){
    if(fitQueued) return;
    fitQueued = true;
    (window.requestAnimationFrame || setTimeout)(fit);
  }
  try{ new MutationObserver(queueFit).observe(app, {childList:true, subtree:true, characterData:true}); }catch(e){}
  window.addEventListener('resize', queueFit);
  window.addEventListener('orientationchange', queueFit);
  window.addEventListener('load', queueFit);
  try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(queueFit); }catch(e){}
  queueFit();

  /* 연결 상태 표시 (.info/connected) */
  var offTimer = null;
  try{
    if(db){
      db.ref('.info/connected').on('value', function(snap){
        if(snap.val() === true){
          if(offTimer){ clearTimeout(offTimer); offTimer = null; }
          if(dbStatus !== 'write-failed') dbStatus = 'connected';
          refreshBadge();
        } else if(!offTimer && dbStatus !== 'write-failed'){
          // 접속 직후엔 잠깐 false가 오므로 8초 기다려 보고도 안 되면 '연결 안 됨'
          dbStatus = 'checking'; refreshBadge();
          offTimer = setTimeout(function(){
            offTimer = null;
            if(dbStatus !== 'write-failed' && dbStatus !== 'connected'){ dbStatus = 'offline'; refreshBadge(); }
          }, 8000);
        }
      });
    }
  }catch(e){}
})();
</script>
</body>
</html>
