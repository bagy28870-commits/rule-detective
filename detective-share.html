<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>규칙 탐정 - 활동1 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F8FF;
    --card:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5A6785;
    --primary:#4C5FD5;
    --primary-ink:#FFFFFF;
    --success:#21B37C;
    --fail:#E8574A;
    --warn:#F5A623;
    --border:#DCE3F5;
    --slot1:#2EC4B6;
    --slot2:#4C5FD5;
    --slot3:#E8574A;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141826; --card:#1E2436; --ink:#EDF1FF; --ink-soft:#AEB8D6; --border:#2C3352;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141826; --card:#1E2436; --ink:#EDF1FF; --ink-soft:#AEB8D6; --border:#2C3352;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .display{font-family:'Jua', sans-serif; letter-spacing:0.5px;}
  #app{max-width:1100px; margin:0 auto; padding:20px 16px 60px; min-height:100vh;}
  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none;}

  /* ---- 역할 선택 화면 ---- */
  .hero{ text-align:center; padding:30px 10px 10px;}
  .hero .glass{font-size:56px;}
  .hero h1{font-size:clamp(26px,5vw,38px); margin:8px 0 4px;}
  .hero p{color:var(--ink-soft); margin:0 0 26px; font-size:16px;}
  .role-grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); max-width:820px; margin:0 auto;}
  .role-card{
    background:var(--card); border:3px solid var(--border); border-radius:22px;
    padding:26px 18px; text-align:center; transition:transform .15s ease, border-color .15s ease;
  }
  .role-card:active{transform:scale(0.97);}
  .role-card .badge{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-family:'Jua',sans-serif;}
  .role-card h3{margin:4px 0 2px; font-size:20px;}
  .role-card p{margin:0; color:var(--ink-soft); font-size:13px;}
  .role-card.teacher{border-style:dashed;}
  .reset-row{text-align:center; margin-top:28px;}
  .reset-msg{font-size:14px; margin-top:8px; min-height:20px; color:var(--ink-soft);}
  .reset-msg.ok{color:var(--success); font-weight:bold;}
  .reset-msg.bad{color:var(--fail); font-weight:bold;}
  .pw-input{width:100%; padding:14px; border-radius:14px; border:3px solid var(--border); font-size:26px; text-align:center;
    letter-spacing:8px; font-family:inherit; background:var(--card); color:var(--ink); box-sizing:border-box; margin:10px 0 4px;}
  .pw-err{color:var(--fail); font-weight:bold; font-size:15px; min-height:22px; text-align:center;}
  .role-card.other{border-style:dashed;}

  /* ---- 학생 화면 공통 ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
  .topbar .who{display:flex; align-items:center; gap:10px;}
  .who .dot{width:14px;height:14px;border-radius:50%;}
  .topbar h2{margin:0; font-size:20px;}
  .progress-pins{display:flex; gap:6px;}
  .progress-pins span{width:9px;height:9px;border-radius:50%;background:var(--border);}
  .progress-pins span.on{background:var(--primary);}
  .level-pill{
    display:inline-block; padding:6px 16px; border-radius:999px; background:var(--card);
    border:2px solid var(--border); font-size:14px; color:var(--ink-soft); margin-bottom:16px;
  }
  .conn-badge{display:block; font-size:12px; margin:-8px 0 14px; padding:4px 2px;}
  .conn-badge.conn-ok{color:var(--success);}
  .conn-badge.conn-wait{color:var(--ink-soft);}
  .conn-badge.conn-bad{color:var(--fail); font-weight:bold;}
  .case-card{
    background:var(--card); border-radius:24px; padding:28px 20px; border:2px dashed var(--border);
    text-align:center; margin-bottom:20px;
  }
  .case-card h3{margin-top:0; font-size:19px;}
  .voice-btn{
    background:var(--warn); border:none; border-radius:50%; width:34px; height:34px;
    font-size:16px; vertical-align:middle; margin-left:4px; box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .voice-btn:active{transform:scale(0.92);}
  .tile-row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:22px 0;}
  .tile{
    width:var(--ts,64px); height:var(--ts,64px); border-radius:calc(var(--ts,64px)*0.25); background:var(--bg); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:calc(var(--ts,64px)*0.56); line-height:1;
    -webkit-appearance:none; appearance:none; padding:0; font-family:inherit;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  }
  .tile.blank{border-style:dashed; color:var(--ink-soft); font-size:calc(var(--ts,64px)*0.56);}
  .tile.correct-flash{border-color:var(--success); box-shadow:0 0 0 3px rgba(33,179,124,.25);}
  .tile.fail-flash{border-color:var(--fail); box-shadow:0 0 0 3px rgba(232,87,74,.25);}
  .opt-row{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:8px;}
  .opt-btn{
    width:var(--os,76px); height:var(--os,76px); border-radius:22px; background:var(--card); border:3px solid var(--border);
    font-size:calc(var(--os,76px)*0.56); line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .opt-btn.picked-correct{border-color:var(--success); background:rgba(33,179,124,.12);}
  .opt-btn.picked-wrong{border-color:var(--fail); background:rgba(232,87,74,.12);}
  .opt-btn:disabled{opacity:.55;}

  .fence-row{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; margin:22px 0;}
  .tile.fence-tile{cursor:pointer; border-width:3px;}
  .tile.fence-tile.selected{border-color:var(--warn); box-shadow:0 0 0 4px rgba(245,166,35,.3);}
  .tile.fence-tile.correct{border-color:var(--success); box-shadow:0 0 0 4px rgba(33,179,124,.3);}
  .tile.fence-tile.wrong{border-color:var(--fail); box-shadow:0 0 0 4px rgba(232,87,74,.3);}
  .fence-marker{font-size:22px; margin-left:6px; vertical-align:middle;}
  /* 묶음 표시: 정답 확인 뒤, 반복되는 부분을 한 묶음씩 둥근 테두리로 묶어서 보여 줌 */
  .tile-row.grouped{gap:16px; align-items:flex-start;}
  .grp{border:3px dashed var(--primary); border-radius:22px; padding:9px 9px 5px; opacity:0; animation:grpIn .45s ease forwards;}
  .grp .grp-tiles{display:flex; gap:8px;}
  .grp .grp-lb{text-align:center; font-weight:bold; font-size:15px; margin-top:5px; color:var(--primary);}
  .grp.c1{border-color:var(--success);} .grp.c1 .grp-lb{color:var(--success);}
  .grp.c2{border-color:var(--warn);}    .grp.c2 .grp-lb{color:var(--warn);}
  .group-note{font-size:16px; font-weight:bold; text-align:center; margin:6px 0 0; color:var(--ink);}
  @keyframes grpIn{from{opacity:0; transform:scale(.88);} to{opacity:1; transform:none;}}

  .feedback{font-size:15px; min-height:22px; margin:10px 0 4px; font-weight:bold;}
  .feedback.ok{color:var(--success);}
  .feedback.bad{color:var(--fail);}
  .cta-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px;}
  .cta{
    padding:14px 26px; border-radius:16px; border:none; background:var(--primary); color:var(--primary-ink);
    font-size:16px; font-weight:bold;
  }
  .cta.secondary{background:var(--card); color:var(--ink); border:2px solid var(--border);}
  .cta small{display:block; font-weight:normal; font-size:11px; margin-top:3px; opacity:.85;}
  .cta.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border); font-size:13px; padding:8px 16px;}
  .cta:disabled{opacity:.4;}

  .safety-banner{
    background:rgba(245,166,35,.14); border:2px solid var(--warn); border-radius:18px; padding:16px;
    margin-bottom:16px; font-size:15px;
  }
  .finish-card{text-align:center; padding:40px 20px;}
  .finish-card .big{font-size:52px;}
  .choice-box{transition:transform .12s ease;}
  .choice-box:active{transform:scale(0.98);}
  .choice-stamp{
    position:absolute; top:-10px; right:-8px; background:#21B37C; color:#fff;
    font-family:'Jua',sans-serif; font-size:13px; padding:5px 12px; border-radius:8px;
    transform:rotate(8deg); box-shadow:0 3px 6px rgba(0,0,0,.2); z-index:2;
  }

  /* ---- 교사 대시보드 ---- */
  .dash-head{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .dash-head p{color:var(--ink-soft); margin:2px 0 0;}
  .dash-grid{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .stu-card{background:var(--card); border-radius:20px; overflow:hidden; border:2px solid var(--border);}
  .stu-tab{padding:14px 18px; color:#fff; display:flex; justify-content:space-between; align-items:center;}
  .stu-tab .name{font-family:'Jua',sans-serif; font-size:18px;}
  .stu-body{padding:16px 18px 18px;}
  .ladder{display:flex; gap:5px; margin-bottom:12px;}
  .ladder span{flex:1; height:8px; border-radius:6px; background:var(--border);}
  .ladder span.on{background:var(--primary);}
  .level-now{
    font-size:19px; font-weight:bold; margin-bottom:10px;
    background:rgba(33,179,124,.12); border:2px solid var(--success); border-radius:14px;
    padding:12px 14px;
  }
  .challenge-now{
    font-size:18px; color:#C97A12; font-weight:bold; margin-bottom:14px;
    background:rgba(245,166,35,.16); border:2px solid var(--warn); border-radius:14px;
    padding:12px 14px;
  }
  .pick-stamp{
    display:inline-block; background:#21B37C; color:#fff; font-size:11px; font-weight:bold;
    padding:3px 9px; border-radius:7px; margin-left:8px; vertical-align:middle;
    transform:rotate(-4deg); box-shadow:0 2px 4px rgba(0,0,0,.18);
  }
  .stat-row{display:flex; justify-content:space-between; align-items:center; font-size:13.5px; margin-bottom:6px; color:var(--ink-soft);}
  .stat-row b{color:var(--ink);}
  .bar-track{background:var(--border); border-radius:6px; height:7px; overflow:hidden; margin-bottom:10px;}
  .bar-fill{height:100%; background:var(--success);}
  .banner-help{
    background:rgba(245,166,35,.16); border:1.5px solid var(--warn); border-radius:12px; padding:8px 12px;
    font-size:13px; margin:10px 0; color:var(--ink);
  }
  .log-title{font-size:12.5px; color:var(--ink-soft); margin:14px 0 6px;}
  .log-item{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--border);}
  .log-item:first-child{border-top:none;}
  .log-item-click{cursor:pointer;}
  .log-item-click:hover{background:var(--bg);}
  .log-arrow{color:var(--ink-soft); margin-left:4px;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,24,38,.55); display:flex; align-items:center;
    justify-content:center; z-index:10000; padding:20px;
  }
  .modal-card{
    background:var(--card); border-radius:22px; padding:24px; max-width:480px; width:100%;
    max-height:85vh; overflow-y:auto;
  }
  .modal-card h3{margin-top:0;}
  .modal-close{
    background:var(--bg); border:none; border-radius:10px; padding:8px 14px; font-size:13px;
    color:var(--ink-soft); float:right;
  }
  .modal-tiles{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
  .modal-tile{
    width:44px; height:44px; border-radius:10px; background:var(--bg); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .modal-tile.picked{border-color:var(--warn); box-shadow:0 0 0 3px rgba(245,166,35,.3);}
  .modal-tile.correctgroup{background:rgba(33,179,124,.14);}
  .modal-tile.answer-slot{border-style:dashed;}
  .modal-row{display:flex; align-items:center; gap:10px; margin:10px 0; font-size:14px;}
  .modal-row .tag{font-size:12px; color:var(--ink-soft); min-width:70px;}
  .modal-icon-big{font-size:30px;}
  .empty-note{color:var(--ink-soft); font-size:13.5px; text-align:center; padding:30px 10px;}
  .back-link{background:none;border:none;color:var(--ink-soft);font-size:13px;margin-bottom:10px;padding:0;}
</style>
