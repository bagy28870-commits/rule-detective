<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>규칙 탐정 - 활동1 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F8FF;
    --card:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5A6785;
    --primary:#4C5FD5;
    --primary-ink:#FFFFFF;
    --success:#21B37C;
    --fail:#E8574A;
    --warn:#F5A623;
    --border:#DCE3F5;
    --slot1:#2EC4B6;
    --slot2:#4C5FD5;
    --slot3:#E8574A;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141826; --card:#1E2436; --ink:#EDF1FF; --ink-soft:#AEB8D6; --border:#2C3352;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141826; --card:#1E2436; --ink:#EDF1FF; --ink-soft:#AEB8D6; --border:#2C3352;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .display{font-family:'Jua', sans-serif; letter-spacing:0.5px;}
  #app{max-width:1100px; margin:0 auto; padding:20px 16px 60px; min-height:100vh;}
  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none;}

  /* ---- 역할 선택 화면 ---- */
  .hero{ text-align:center; padding:30px 10px 10px;}
  .hero .glass{font-size:56px;}
  .hero h1{font-size:clamp(26px,5vw,38px); margin:8px 0 4px;}
  .hero p{color:var(--ink-soft); margin:0 0 26px; font-size:16px;}
  .role-grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); max-width:820px; margin:0 auto;}
  .role-card{
    background:var(--card); border:3px solid var(--border); border-radius:22px;
    padding:26px 18px; text-align:center; transition:transform .15s ease, border-color .15s ease;
  }
  .role-card:active{transform:scale(0.97);}
  .role-card .badge{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-family:'Jua',sans-serif;}
  .role-card h3{margin:4px 0 2px; font-size:20px;}
  .role-card p{margin:0; color:var(--ink-soft); font-size:13px;}
  .role-card.teacher{border-style:dashed;}
  .reset-row{text-align:center; margin-top:28px;}
  .reset-msg{font-size:14px; margin-top:8px; min-height:20px; color:var(--ink-soft);}
  .reset-msg.ok{color:var(--success); font-weight:bold;}
  .reset-msg.bad{color:var(--fail); font-weight:bold;}
  .pw-input{width:100%; padding:14px; border-radius:14px; border:3px solid var(--border); font-size:26px; text-align:center;
    letter-spacing:8px; font-family:inherit; background:var(--card); color:var(--ink); box-sizing:border-box; margin:10px 0 4px;}
  .pw-err{color:var(--fail); font-weight:bold; font-size:15px; min-height:22px; text-align:center;}
  .role-card.other{border-style:dashed;}

  /* ---- 학생 화면 공통 ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
  .topbar .who{display:flex; align-items:center; gap:10px;}
  .who .dot{width:14px;height:14px;border-radius:50%;}
  .topbar h2{margin:0; font-size:20px;}
  .progress-pins{display:flex; gap:6px;}
  .progress-pins span{width:9px;height:9px;border-radius:50%;background:var(--border);}
  .progress-pins span.on{background:var(--primary);}
  .level-pill{
    display:inline-block; padding:6px 16px; border-radius:999px; background:var(--card);
    border:2px solid var(--border); font-size:14px; color:var(--ink-soft); margin-bottom:16px;
  }
  .conn-badge{display:block; font-size:12px; margin:-8px 0 14px; padding:4px 2px;}
  .conn-badge.conn-ok{color:var(--success);}
  .conn-badge.conn-wait{color:var(--ink-soft);}
  .conn-badge.conn-bad{color:var(--fail); font-weight:bold;}
  .case-card{
    background:var(--card); border-radius:24px; padding:28px 20px; border:2px dashed var(--border);
    text-align:center; margin-bottom:20px;
  }
  .case-card h3{margin-top:0; font-size:19px;}
  .voice-btn{
    background:var(--warn); border:none; border-radius:50%; width:34px; height:34px;
    font-size:16px; vertical-align:middle; margin-left:4px; box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .voice-btn:active{transform:scale(0.92);}
  .tile-row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:22px 0;}
  .tile{
    width:64px; height:64px; border-radius:16px; background:var(--bg); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:32px;
    -webkit-appearance:none; appearance:none; padding:0; font-family:inherit;
    -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  }
  .tile.blank{border-style:dashed; color:var(--ink-soft); font-size:26px;}
  .tile.correct-flash{border-color:var(--success); box-shadow:0 0 0 3px rgba(33,179,124,.25);}
  .tile.fail-flash{border-color:var(--fail); box-shadow:0 0 0 3px rgba(232,87,74,.25);}
  .opt-row{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:8px;}
  .opt-btn{
    width:76px; height:76px; border-radius:18px; background:var(--card); border:3px solid var(--border);
    font-size:36px; display:flex; align-items:center; justify-content:center;
  }
  .opt-btn.picked-correct{border-color:var(--success); background:rgba(33,179,124,.12);}
  .opt-btn.picked-wrong{border-color:var(--fail); background:rgba(232,87,74,.12);}
  .opt-btn:disabled{opacity:.55;}

  .fence-row{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; margin:22px 0;}
  .tile.fence-tile{cursor:pointer; border-width:3px;}
  .tile.fence-tile.selected{border-color:var(--warn); box-shadow:0 0 0 4px rgba(245,166,35,.3);}
  .tile.fence-tile.correct{border-color:var(--success); box-shadow:0 0 0 4px rgba(33,179,124,.3);}
  .tile.fence-tile.wrong{border-color:var(--fail); box-shadow:0 0 0 4px rgba(232,87,74,.3);}
  .fence-marker{font-size:22px; margin-left:6px; vertical-align:middle;}
  /* 묶음 표시: 정답 확인 뒤, 반복되는 부분을 한 묶음씩 둥근 테두리로 묶어서 보여 줌 */
  .tile-row.grouped{gap:16px; align-items:flex-start;}
  .grp{border:3px dashed var(--primary); border-radius:22px; padding:9px 9px 5px; opacity:0; animation:grpIn .45s ease forwards;}
  .grp .grp-tiles{display:flex; gap:8px;}
  .grp .grp-lb{text-align:center; font-weight:bold; font-size:15px; margin-top:5px; color:var(--primary);}
  .grp.c1{border-color:var(--success);} .grp.c1 .grp-lb{color:var(--success);}
  .grp.c2{border-color:var(--warn);}    .grp.c2 .grp-lb{color:var(--warn);}
  .group-note{font-size:16px; font-weight:bold; text-align:center; margin:6px 0 0; color:var(--ink);}
  @keyframes grpIn{from{opacity:0; transform:scale(.88);} to{opacity:1; transform:none;}}

  .feedback{font-size:15px; min-height:22px; margin:10px 0 4px; font-weight:bold;}
  .feedback.ok{color:var(--success);}
  .feedback.bad{color:var(--fail);}
  .cta-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px;}
  .cta{
    padding:14px 26px; border-radius:16px; border:none; background:var(--primary); color:var(--primary-ink);
    font-size:16px; font-weight:bold;
  }
  .cta.secondary{background:var(--card); color:var(--ink); border:2px solid var(--border);}
  .cta small{display:block; font-weight:normal; font-size:11px; margin-top:3px; opacity:.85;}
  .cta.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border); font-size:13px; padding:8px 16px;}
  .cta:disabled{opacity:.4;}

  .safety-banner{
    background:rgba(245,166,35,.14); border:2px solid var(--warn); border-radius:18px; padding:16px;
    margin-bottom:16px; font-size:15px;
  }
  .finish-card{text-align:center; padding:40px 20px;}
  .finish-card .big{font-size:52px;}
  .choice-box{transition:transform .12s ease;}
  .choice-box:active{transform:scale(0.98);}
  .choice-stamp{
    position:absolute; top:-10px; right:-8px; background:#21B37C; color:#fff;
    font-family:'Jua',sans-serif; font-size:13px; padding:5px 12px; border-radius:8px;
    transform:rotate(8deg); box-shadow:0 3px 6px rgba(0,0,0,.2); z-index:2;
  }

  /* ---- 교사 대시보드 ---- */
  .dash-head{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .dash-head p{color:var(--ink-soft); margin:2px 0 0;}
  .dash-grid{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .stu-card{background:var(--card); border-radius:20px; overflow:hidden; border:2px solid var(--border);}
  .stu-tab{padding:14px 18px; color:#fff; display:flex; justify-content:space-between; align-items:center;}
  .stu-tab .name{font-family:'Jua',sans-serif; font-size:18px;}
  .stu-body{padding:16px 18px 18px;}
  .ladder{display:flex; gap:5px; margin-bottom:12px;}
  .ladder span{flex:1; height:8px; border-radius:6px; background:var(--border);}
  .ladder span.on{background:var(--primary);}
  .level-now{
    font-size:19px; font-weight:bold; margin-bottom:10px;
    background:rgba(33,179,124,.12); border:2px solid var(--success); border-radius:14px;
    padding:12px 14px;
  }
  .challenge-now{
    font-size:18px; color:#C97A12; font-weight:bold; margin-bottom:14px;
    background:rgba(245,166,35,.16); border:2px solid var(--warn); border-radius:14px;
    padding:12px 14px;
  }
  .pick-stamp{
    display:inline-block; background:#21B37C; color:#fff; font-size:11px; font-weight:bold;
    padding:3px 9px; border-radius:7px; margin-left:8px; vertical-align:middle;
    transform:rotate(-4deg); box-shadow:0 2px 4px rgba(0,0,0,.18);
  }
  .stat-row{display:flex; justify-content:space-between; align-items:center; font-size:13.5px; margin-bottom:6px; color:var(--ink-soft);}
  .stat-row b{color:var(--ink);}
  .bar-track{background:var(--border); border-radius:6px; height:7px; overflow:hidden; margin-bottom:10px;}
  .bar-fill{height:100%; background:var(--success);}
  .banner-help{
    background:rgba(245,166,35,.16); border:1.5px solid var(--warn); border-radius:12px; padding:8px 12px;
    font-size:13px; margin:10px 0; color:var(--ink);
  }
  .log-title{font-size:12.5px; color:var(--ink-soft); margin:14px 0 6px;}
  .log-item{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--border);}
  .log-item:first-child{border-top:none;}
  .log-item-click{cursor:pointer;}
  .log-item-click:hover{background:var(--bg);}
  .log-arrow{color:var(--ink-soft); margin-left:4px;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,24,38,.55); display:flex; align-items:center;
    justify-content:center; z-index:10000; padding:20px;
  }
  .modal-card{
    background:var(--card); border-radius:22px; padding:24px; max-width:480px; width:100%;
    max-height:85vh; overflow-y:auto;
  }
  .modal-card h3{margin-top:0;}
  .modal-close{
    background:var(--bg); border:none; border-radius:10px; padding:8px 14px; font-size:13px;
    color:var(--ink-soft); float:right;
  }
  .modal-tiles{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0;}
  .modal-tile{
    width:44px; height:44px; border-radius:10px; background:var(--bg); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .modal-tile.picked{border-color:var(--warn); box-shadow:0 0 0 3px rgba(245,166,35,.3);}
  .modal-tile.correctgroup{background:rgba(33,179,124,.14);}
  .modal-tile.answer-slot{border-style:dashed;}
  .modal-row{display:flex; align-items:center; gap:10px; margin:10px 0; font-size:14px;}
  .modal-row .tag{font-size:12px; color:var(--ink-soft); min-width:70px;}
  .modal-icon-big{font-size:30px;}
  .empty-note{color:var(--ink-soft); font-size:13.5px; text-align:center; padding:30px 10px;}
  .back-link{background:none;border:none;color:var(--ink-soft);font-size:13px;margin-bottom:10px;padding:0;}
</style>
</head>
<body>

<script>
(function(){
  "use strict";

  function dlog(){} // 운영용 빌드: 로그는 무시

  var EMOJI = {A:'🔴', B:'🟦', C:'⭐', D:'🟣'};
  var ICON_POOL = ['🔴','🟦','⭐','🟣','🟢','🔺','🟧','🔷'];
  var ALL_KEYS = ['A','B','C','D','E'];

  // 활동1 공통 규칙 순서 (모든 학생이 같은 순서로 진단받음): ABAB-AABB-AAB-ABC-AABC-ABBC-ABCC-ABCA
  var MASTER_LEVELS = [
    {id:'L0', title:'ABAB 규칙',  unit:['A','B'], repeats:3, options:2},
    {id:'L1', title:'AABB 규칙',  unit:['A','A','B','B'], repeats:3, options:4},
    {id:'L2', title:'AAB 규칙',   unit:['A','A','B'], repeats:3, options:4},
    {id:'L3', title:'ABC 규칙',   unit:['A','B','C'], repeats:3, options:4},
    {id:'L4', title:'AABC 규칙',  unit:['A','A','B','C'], repeats:3, options:4},
    {id:'L5', title:'ABBC 규칙',  unit:['A','B','B','C'], repeats:3, options:4},
    {id:'L6', title:'ABCC 규칙',  unit:['A','B','C','C'], repeats:3, options:4},
    {id:'L7', title:'ABCA 규칙',  unit:['A','B','C','A'], repeats:3, options:4}
  ];

  var SLOTS = {
    slot1: { label:'송서연', accent:'#2EC4B6', levels:MASTER_LEVELS, startIndex:0 },
    slot2: { label:'최이찬', accent:'#4C5FD5', levels:MASTER_LEVELS, startIndex:0 },
    slot3: { label:'이용준', accent:'#E8574A', levels:MASTER_LEVELS, startIndex:4 } // AABC 규칙부터 시작
  };

  // 명단에 없는 '그 외 친구'가 이름을 입력하고 참여할 때 쓰는 공용 사다리(모두 같은 활동1 순서 사용).
  var OTHER_ACCENT = '#8B5FBF';
  var OTHER_LEVELS = MASTER_LEVELS;
  var otherConfigs = {}; // key(예: other_abc123) -> {label, accent, levels} (이 브라우저에서 만든 세션용)

  function getCfg(slot){
    return SLOTS[slot] || otherConfigs[slot] || null;
  }

  // 교사 화면 등 '다른 브라우저'에서 실시간 데이터만 보고 카드 정보를 재구성할 때 쓰는 함수.
  function cfgForSlot(slot, data){
    return SLOTS[slot] || {
      label: (data && data.displayLabel) || slot,
      accent: OTHER_ACCENT,
      levels: OTHER_LEVELS
    };
  }

  function sanitizeKey(str){
    return String(str).replace(/[.#$\[\]\/\s]/g,'') || 'friend';
  }

  var MAX_QUESTIONS = 20; // 안전장치용 상한 (8단계 x 최대 2번 시도 = 16번이면 자연 종료됨)

  var app = document.getElementById('app');
  var db = null;
  var dbStatus = 'checking'; // checking | connected | no-db | offline | write-failed
  var mySlot = null;
  var unsub = null;
  var teacherUnsubs = [];
  var teacherCache = {};

  var S = null; // current session state for a student

  init();

  function init(){
    dlog('앱 시작됨');
    try {
      if (fbDb) {
        db = fbDb;
        dbStatus = 'connected';
        dlog('Firebase 연결됨');
      } else {
        db = null;
        dbStatus = 'no-db';
        dlog('Firebase 연결 실패', true);
      }
    } catch(e){
      db = null;
      dbStatus = 'no-db';
      dlog('DB 초기화 오류: ' + e.message, true);
    }
    renderRoleSelect();
  }

  function statusBadgeHtml(){
    if(dbStatus === 'connected') return '<span class="conn-badge conn-ok">🟢 교사 화면 연결됨</span>';
    if(dbStatus === 'checking') return '<span class="conn-badge conn-wait">🟡 연결 확인 중…</span>';
    if(dbStatus === 'write-failed') return '<span class="conn-badge conn-bad">🔴 저장 실패 — 인터넷 연결을 확인해주세요</span>';
    return '<span class="conn-badge conn-bad">🔴 연결 안 됨 — 인터넷 연결을 확인해주세요</span>';
  }

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.85;
      utter.pitch = 1.05;
      window.speechSynthesis.speak(utter);
    } catch(e){ /* 음성 지원 안 되면 조용히 무시 */ }
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  /* ================= 역할 선택 ================= */
  function renderRoleSelect(){
    app.innerHTML =
      '<div class="hero">'+
        '<div class="glass">🔍</div>'+
        '<h1 class="display">규칙 탐정 활동실</h1>'+
        '<p>누가 사용하는 화면인가요?</p>'+
      '</div>'+
      '<div class="role-grid">'+
        roleCard('slot1', SLOTS.slot1) +
        roleCard('slot2', SLOTS.slot2) +
        roleCard('slot3', SLOTS.slot3) +
        '<div class="role-card other" id="pick-other">'+
          '<div class="badge" style="background:'+OTHER_ACCENT+'">➕</div>'+
          '<h3>그 외 친구</h3>'+
          '<p>이름 입력하고 참여하기</p>'+
        '</div>'+
        '<div class="role-card teacher" id="pick-teacher">'+
          '<div class="badge" style="background:var(--ink-soft)">🖥️</div>'+
          '<h3>교사용 전자칠판</h3>'+
          '<p>실시간 현황판 보기</p>'+
        '</div>'+
      '</div>'+
      '<div class="reset-row">'+
        '<button class="cta ghost" id="reset-btn">🧹 기록 초기화</button>'+
        '<div class="reset-msg" id="reset-msg"></div>'+
      '</div>';

    ['slot1','slot2','slot3'].forEach(function(s){
      document.getElementById('pick-'+s).onclick = function(){ startStudent(s); };
    });
    document.getElementById('pick-other').onclick = renderOtherNameEntry;
    document.getElementById('pick-teacher').onclick = renderTeacher;
    document.getElementById('reset-btn').onclick = resetAllRecords;
  }

  /* 모든 학생의 활동 기록을 지워서 새로 시작할 수 있게 함 (아이들이 잘못 누르지 않도록 비밀번호 필요) */
  var RESET_PASSWORD = '1234';   // ← 초기화 비밀번호. 바꾸려면 이 숫자만 고치세요.

  function resetAllRecords(){
    var msg = document.getElementById('reset-msg');
    function show(text, cls){ if(msg){ msg.textContent = text; msg.className = 'reset-msg ' + (cls||''); } }
    var target = db || fbDb;
    if(!target){ show('연결이 안 되어 있어서 초기화할 수 없어요. 인터넷을 확인해 주세요.', 'bad'); return; }
    show('', '');

    var overlay = document.createElement('div');
    overlay.className = 'modal-backdrop';
    overlay.innerHTML =
      '<div class="modal-card" style="max-width:380px; text-align:center;">'+
        '<h3 class="display">🔒 선생님 비밀번호</h3>'+
        '<p style="margin:0 0 6px; color:var(--ink-soft); font-size:15px;">모든 학생의 활동 기록이 지워져요.<br>비밀번호를 입력해 주세요.</p>'+
        '<input class="pw-input" id="pw-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••">'+
        '<div class="pw-err" id="pw-err"></div>'+
        '<div class="cta-row">'+
          '<button class="cta ghost" id="pw-cancel">취소</button>'+
          '<button class="cta" id="pw-ok">지우기</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(overlay);
    var input = document.getElementById('pw-input');
    var err = document.getElementById('pw-err');
    setTimeout(function(){ try{ input.focus(); }catch(e){} }, 50);

    function close(){ overlay.remove(); }
    function submit(){
      if(input.value !== RESET_PASSWORD){
        err.textContent = '비밀번호가 맞지 않아요';
        input.value = ''; input.focus();
        return;
      }
      close();
      show('지우는 중…', '');
      target.ref('students').remove().then(function(){
        show('✅ 기록을 모두 지웠어요. 이제 새로 시작할 수 있어요.', 'ok');
      }).catch(function(e){
        dlog('기록 초기화 실패: ' + (e && e.message), true);
        show('지우지 못했어요' + (e && e.code ? ' ['+e.code+']' : '') + '. 인터넷 연결을 확인해 주세요.', 'bad');
      });

    document.getElementById('pw-cancel').onclick = close;
    document.getElementById('pw-ok').onclick = submit;
    input.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); if(e.key === 'Escape') close(); });
    overlay.addEventListener('click', function(e){ if(e.target === overlay) close(); });
  }

  /* ================= 학생 진단 흐름 ================= */
  function startStudent(slot){
    mySlot = slot;
    var cfg = getCfg(slot);
    var startIdx = (cfg && cfg.startIndex) || 0;
    S = {
      levelIndex:startIdx, retrying:false, status:'active',
      canDoIndex:-1, challengeIndex:startIdx,
      predictionCorrect:0, predictionTotal:0,
      boundaryCorrect:0, boundaryTotal:0,
      log:[], questionCount:0,
      q:null, step:'predict', picked:null, tileChoice:[], locked:false,
      chosenSide:null
    };
    newQuestion();
  }

  function newQuestion(){
    var cfg = getCfg(mySlot);
    if(!cfg) return;
    var level = cfg.levels[S.levelIndex];
    var full = [];
    for(var r=0;r<level.repeats;r++){ full = full.concat(level.unit); }
    var correctKey = full[full.length-1];
    var shown = full.slice(0, full.length-1);

    var uniqueUnitKeys = [];
    level.unit.forEach(function(k){ if(uniqueUnitKeys.indexOf(k) === -1) uniqueUnitKeys.push(k); });

    var optSet = [correctKey];
    var guardCount = 0;
    var maxOptions = Math.min(level.options, uniqueUnitKeys.length);
    while(optSet.length < maxOptions && guardCount < 30){
      var k = uniqueUnitKeys[Math.floor(Math.random()*uniqueUnitKeys.length)];
      if(optSet.indexOf(k) === -1) optSet.push(k);
      guardCount++;
    }
    var options = shuffle(optSet);

    var iconPool = shuffle(ICON_POOL).slice(0, ALL_KEYS.length);
    var iconMap = {};
    ALL_KEYS.forEach(function(key, i){ iconMap[key] = iconPool[i]; });

    S.q = {
      level:level, full:full, shown:shown, correctKey:correctKey,
      options:options, unitLength:level.unit.length, iconMap:iconMap
    };
    S.step = 'predict';
    S.picked = null;
    S.tileChoice = [];
    S.locked = false;
    renderStudentQuestion();
  }

  function renderStudentQuestion(){
    var cfg = getCfg(mySlot);
    if(!cfg) return;
    var level = S.q.level;
    var pinsHtml = '';
    for(var i=0;i<MAX_QUESTIONS;i++){
      pinsHtml += '<span class="'+(i < S.questionCount ? 'on':'')+'"></span>';
    }

    var body = '';
    if(S.step === 'predict'){
      body = renderPredictStep();
    } else {
      body = renderFenceStep();
    }

    app.innerHTML =
      '<div class="topbar">'+
        '<div class="who"><span class="dot" style="background:'+cfg.accent+'"></span><h2>'+cfg.label+'</h2></div>'+
        '<div class="progress-pins">'+pinsHtml+'</div>'+
      '</div>'+
      '<div class="level-pill">🔍 지금 단계: <b>'+ruleDisplayHtml(level, 16)+'</b> ('+(S.levelIndex+1)+'/'+cfg.levels.length+')</div>'+
      statusBadgeHtml()+
      body +
      '<button class="cta ghost" id="quit-btn">역할 다시 선택</button>';

    document.getElementById('quit-btn').onclick = function(){
      teardownStudentListeners();
      renderRoleSelect();
    };
    attachStepHandlers();
  }

  function renderPredictStep(){
    var tiles = S.q.shown.map(function(k){ return '<div class="tile">'+S.q.iconMap[k]+'</div>'; }).join('');
    tiles += '<div class="tile blank" id="blank-tile">❓</div>';
    var opts = S.q.options.map(function(k,idx){
      return '<button class="opt-btn" data-key="'+k+'" data-idx="'+idx+'">'+S.q.iconMap[k]+'</button>';
    }).join('');
    var voiceText = '다음에는 어떤 무늬가 올까요? 아래 그림 중에서 하나를 골라 눌러보세요.';
    setTimeout(function(){ speak(voiceText); }, 200);
    return '<div class="case-card">'+
      '<h3>🧩 다음에는 어떤 무늬가 올까요? '+
        '<button class="voice-btn" id="voice-predict" title="다시 듣기">🔊</button></h3>'+
      '<div class="tile-row">'+tiles+'</div>'+
      '<div class="opt-row">'+opts+'</div>'+
      '<div class="feedback" id="predict-feedback"></div>'+
      '<div class="cta-row" id="predict-next-wrap"></div>'+
    '</div>';
  }

  function renderFenceStep(){
    var full = S.q.full;
    var tilesHtml = full.map(function(k, idx){
      return '<button type="button" class="tile fence-tile" data-idx="'+idx+'">'+S.q.iconMap[k]+'</button>';
    }).join('');
    var voiceText = '반복되는 무늬 부분을 모두 눌러 보세요!';
    setTimeout(function(){ speak(voiceText); }, 200);
    return '<div class="case-card">'+
      '<h3>🚧 반복되는 무늬 부분을 모두 눌러 보세요! '+
        '<button class="voice-btn" id="voice-fence" title="다시 듣기">🔊</button></h3>'+
      '<div class="tile-row" id="fence-tiles">'+tilesHtml+'</div>'+
      '<div class="feedback" id="fence-feedback"></div>'+
      '<div class="cta-row" id="fence-cta-wrap">'+
        '<button class="cta" id="fence-submit" disabled>완성! 🚧</button>'+
      '</div>'+
    '</div>';

  function attachStepHandlers(){
    try{
    var voicePredictBtn = document.getElementById('voice-predict');
    if(voicePredictBtn) voicePredictBtn.onclick = function(){
      speak('다음에는 어떤 무늬가 올까요? 아래 그림 중에서 하나를 골라 눌러보세요.');
    };
    var voiceFenceBtn = document.getElementById('voice-fence');
    if(voiceFenceBtn) voiceFenceBtn.onclick = function(){
      speak('반복되는 무늬 부분을 모두 눌러 보세요!');
    };
    if(S.step === 'predict'){
      var btns = document.querySelectorAll('.opt-btn');
      btns.forEach(function(b){
        b.onclick = function(){
          if(S.locked) return;
          S.locked = true;
          var key = this.getAttribute('data-key');
          S.picked = key;
          var ok = key === S.q.correctKey;
          btns.forEach(function(bb){ bb.disabled = true; });
          this.classList.add(ok ? 'picked-correct' : 'picked-wrong');
          var blank = document.getElementById('blank-tile');
          blank.textContent = S.q.iconMap[S.q.correctKey];
          blank.classList.add(ok ? 'correct-flash' : 'fail-flash');
          if(!ok){
            btns.forEach(function(bb){
              if(bb.getAttribute('data-key') === S.q.correctKey) bb.classList.add('picked-correct');
            });
          }
          document.getElementById('predict-feedback').className = 'feedback ' + (ok ? 'ok':'bad');
          document.getElementById('predict-feedback').textContent = ok ? '정답이에요! 잘 예측했어요 🎉' : '아쉬워요! 정답은 이거예요';
          S.predictionTotal++;
          if(ok) S.predictionCorrect++;
          S.predictOk = ok;
          document.getElementById('predict-next-wrap').innerHTML =
            '<button class="cta" id="to-fence-btn">확인했어요 →</button>';
          document.getElementById('to-fence-btn').onclick = function(){
            S.step = 'fence';
            S.locked = false;
            renderStudentQuestion();
          };
        };
      });
    } else {
      var tileEls = document.querySelectorAll('.fence-tile');
      dlog('묶음찾기 단계: 조각 ' + tileEls.length + '개에 클릭 이벤트 부착 시도');
      var selected = {};
      function paintTile(el, kind){
        if(kind === 'selected'){
          el.style.borderColor = '#F5A623';
          el.style.borderWidth = '4px';
          el.style.boxShadow = '0 0 0 4px rgba(245,166,35,.35)';
          el.style.background = '#FFF6E8';
        } else if(kind === 'correct'){
          el.style.borderColor = '#21B37C';
          el.style.borderWidth = '4px';
          el.style.boxShadow = '0 0 0 4px rgba(33,179,124,.35)';
          el.style.background = '#E9FBF3';
        } else if(kind === 'wrong'){
          el.style.borderColor = '#E8574A';
          el.style.borderWidth = '4px';
          el.style.boxShadow = '0 0 0 4px rgba(232,87,74,.35)';
          el.style.background = '#FDECEA';
        } else {
          el.style.borderColor = '';
          el.style.borderWidth = '';
          el.style.boxShadow = '';
          el.style.background = '';
        }
      }
      tileEls.forEach(function(el, i){
        el.onclick = function(){
          dlog('조각 클릭됨: idx=' + this.getAttribute('data-idx') + ' / 클릭 전 클래스=' + this.className);
          if(S.locked) return;
          var idx = parseInt(this.getAttribute('data-idx'),10);
          if(selected[idx]){
            delete selected[idx];
            paintTile(this, 'none');
          } else {
            selected[idx] = true;
            paintTile(this, 'selected');
          }
          S.tileChoice = Object.keys(selected).map(Number);
          document.getElementById('fence-submit').disabled = (S.tileChoice.length === 0);
          dlog('클릭 후 인라인 스타일=' + this.getAttribute('style'));
        };
      });
      dlog('클릭 이벤트 부착 완료');
      document.getElementById('fence-submit').onclick = function(){
        if(S.locked || !S.tileChoice || S.tileChoice.length === 0) return;
        S.locked = true;
        var chosen = S.tileChoice.slice().sort(function(a,b){ return a-b; });
        var unitLen = S.q.unitLength;
        var ok = false;
        if(chosen.length === unitLen){
          var start = chosen[0];
          if(start % unitLen === 0){
            ok = chosen.every(function(v,i){ return v === start+i; });
          }
        }
        tileEls.forEach(function(el){
          var idx = parseInt(el.getAttribute('data-idx'),10);
          if(chosen.indexOf(idx) !== -1){
            paintTile(el, ok ? 'correct' : 'wrong');
          } else {
            paintTile(el, 'none');
          }
        });
        var fb = document.getElementById('fence-feedback');
        fb.className = 'feedback ' + (ok?'ok':'bad');
        fb.textContent = ok ? '정확해요! 이게 반복되는 부분이에요! 🎉' : '조금 달라요! 반복되는 부분을 보여줄게요';
        if(!ok){
          for(var i=0;i<unitLen;i++){
            var el2 = document.querySelector('.fence-tile[data-idx="'+i+'"]');
            if(el2 && chosen.indexOf(i) === -1) paintTile(el2, 'correct');
          }
        }
        S.boundaryTotal++;
        if(ok) S.boundaryCorrect++;
        S.boundaryOk = ok;
        document.getElementById('fence-cta-wrap').innerHTML =
          '<button class="cta" id="finish-q-btn">다음 →</button>';
        document.getElementById('finish-q-btn').onclick = finalizeQuestion;
        setTimeout(showGroupedPattern, 1000);   // 묶음 표시 보여 주기
      };
    }
    } catch(err){
      dlog('attachStepHandlers 오류: ' + err.message, true);
    }
  }

  // 반복되는 부분을 한 묶음씩 테두리로 묶어서 모두 보여 줌 (예: ●▲ ●▲ ●▲ → 1묶음, 2묶음, 3묶음)
  function showGroupedPattern(){
    var row = document.getElementById('fence-tiles');
    if(!row || S.step !== 'fence' || !S.q) return;
    var unitLen = S.q.unitLength, full = S.q.full, n = Math.floor(full.length / unitLen);
    var h = '';
    for(var g=0; g<n; g++){
      var tiles = '';
      for(var i=0; i<unitLen; i++){ tiles += '<div class="tile">'+S.q.iconMap[full[g*unitLen+i]]+'</div>'; }
      h += '<div class="grp c'+(g%3)+'" style="animation-delay:'+(g*0.35)+'s">'+
             '<div class="grp-tiles">'+tiles+'</div><div class="grp-lb">'+(g+1)+'묶음</div></div>';
    }
    row.innerHTML = h;
    row.classList.add('grouped');
    var note = document.createElement('div');
    note.className = 'group-note';
    note.textContent = '🔗 같은 묶음이 ' + n + '번 반복돼요!';
    row.parentNode.insertBefore(note, document.getElementById('fence-feedback'));
    speak('같은 묶음이 ' + n + '번 반복돼요!');
  }

  function finalizeQuestion(){
    var cfg = getCfg(mySlot);
    if(!cfg) return;
    var level = S.q.level;
    var bothOk = S.predictOk && S.boundaryOk;
    var bothWrong = !S.predictOk && !S.boundaryOk;

    S.log.unshift({
      level:level.title, predictionOk:S.predictOk, boundaryOk:S.boundaryOk, ts:Date.now(),
      fullIcons: S.q.full.map(function(k){ return S.q.iconMap[k]; }),
      predictedIcon: S.q.iconMap[S.picked] || '❓',
      correctIcon: S.q.iconMap[S.q.correctKey],
      pickedTiles: (S.tileChoice || []).slice(),
      unitLength: S.q.unitLength
    });
    if(S.log.length > 8) S.log = S.log.slice(0,8);
    S.questionCount++;

    // 규칙: 두 문제(규칙찾기+다음규칙찾기) 모두 맞히면 다음 단계로.
    // 하나만 맞히면 같은 단계에서 다른 무늬로 한 번 더 시도 → 거기서도 하나만 맞으면 종료.
    // 두 문제 다 틀리면 바로 종료.
    if(bothOk){
      S.retrying = false;
      S.canDoIndex = S.levelIndex; // 방금 완전히 통과한 단계
      var reachedTop = (S.levelIndex === cfg.levels.length-1);
      if(reachedTop || S.questionCount >= MAX_QUESTIONS){
        S.challengeIndex = null; // 모든 단계 완료
        S.status = 'ended';
        pushToDb();
        renderSessionEnd();
        return;
      }
      S.levelIndex++;
      S.challengeIndex = S.levelIndex; // 다음에 도전할(현재 진행 중인) 단계
      S.status = 'active';
      pushToDb();
      newQuestion();
      return;
    }

    if(bothWrong){
      S.challengeIndex = S.levelIndex; // 틀린 이 단계가 도전 과제
      S.status = 'ended';
      pushToDb();
      renderSessionEnd();
      return;
    }

    // 하나만 맞은 경우 (부분 정답)
    S.challengeIndex = S.levelIndex;
    if(!S.retrying){
      S.retrying = true;
      S.status = 'active';
      pushToDb();
      if(S.questionCount >= MAX_QUESTIONS){
        S.status = 'ended';
        pushToDb();
        renderSessionEnd();
        return;
      }
      newQuestion(); // 같은 단계, 새 무늬로 재도전
      return;
    } else {
      S.status = 'ended';
      pushToDb();
      renderSessionEnd();
      return;
    }
  }

  function computeChallenge(cfg, levelIndex, lastLog){
    var hasNext = levelIndex < cfg.levels.length - 1;
    if(lastLog && (!lastLog.predictionOk || !lastLog.boundaryOk)){
      if(!lastLog.predictionOk && !lastLog.boundaryOk){
        return lastLog.level + ' 규칙에서 <b>반복 묶음 찾기</b>와 <b>다음 무늬 예측</b>을 더 연습해봐요';
      } else if(!lastLog.predictionOk){
        return lastLog.level + ' 규칙에서 <b>다음에 이어질 무늬 찾기</b>를 더 연습해봐요';
      } else {
        return lastLog.level + ' 규칙에서 <b>반복되는 묶음 찾기</b>를 더 연습해봐요';
      }
    }
    return hasNext
      ? '<b>'+cfg.levels[levelIndex+1].title+'</b>에 도전해봐요!'
      : '최고 단계까지 다 해냈어요! 나만의 규칙 만들기 준비 완료 🎨';
  }

  var RESULT_SHAPES = {A:'●', B:'▲', C:'■', D:'◆', E:'★'};

  function shapesForUnit(unit){
    return unit.map(function(k){ return RESULT_SHAPES[k] || '●'; }).join('');
  }

  // 도형을 먼저 크게, 영어 규칙명은 뒤에 작은 괄호 글씨로 보여주는 공용 표시.
  function ruleDisplayHtml(level, shapeSize){
    var code = level.title.replace(' 규칙','');
    return '<span style="font-size:'+(shapeSize||18)+'px; letter-spacing:2px;">'+shapesForUnit(level.unit)+'</span>'+
      ' <span class="rule-code" style="font-size:11px; color:var(--ink-soft);">('+code+')</span>';
  }

  function findLevelByTitle(cfg, title){
    for(var i=0;i<cfg.levels.length;i++){
      if(cfg.levels[i].title === title) return cfg.levels[i];
    }
    return null;
  }

  function renderShapeRow(level){
    return '<div style="font-size:30px; letter-spacing:8px; margin-top:8px; color:var(--ink);">' +
      level.unit.map(function(k){ return RESULT_SHAPES[k] || '●'; }).join(' ') +
    '</div>';
  }

  var STAMP_HTML =
    '<div class="choice-stamp">✅ 선택함</div>';

  function renderSessionEnd(){
    var cfg = getCfg(mySlot);
    if(!cfg) return;
    var hasCanDo = S.canDoIndex >= 0;

    var canDoInner = hasCanDo
      ? renderShapeRow(cfg.levels[S.canDoIndex])
      : '<p style="margin:6px 0 0; color:var(--ink-soft); font-size:14px;">아직 없어요, 다음에 또 도전해봐요!</p>';

    var challengeInner = (S.challengeIndex == null)
      ? '<p style="margin:6px 0 0; color:var(--success); font-weight:bold; font-size:14px;">🎉 최고 단계까지 다 해냈어요!</p>'
      : renderShapeRow(cfg.levels[S.challengeIndex]);

    var chosen = S.chosenSide || null; // null | 'can' | 'challenge'

    app.innerHTML =
      '<div class="case-card finish-card">'+
        '<div class="big">🏁</div>'+
        '<h3 class="display">오늘의 탐정 활동 결과</h3>'+
        '<p style="color:var(--ink-soft); margin:0 0 20px;">다음 활동에서 만들 규칙을 골라볼까요?</p>'+
        '<div class="choice-box" id="choice-can" style="position:relative; background:rgba(33,179,124,.12); border:2px solid var(--success); border-radius:16px; padding:16px 18px; margin-bottom:14px; text-align:center; cursor:pointer;">'+
          (chosen==='can' ? STAMP_HTML : '')+
          '<div style="color:var(--success); font-weight:bold; font-size:15px;">✅ 내가 잘할 수 있는 규칙</div>'+
          canDoInner+
        '</div>'+
        '<div class="choice-box" id="choice-challenge" style="position:relative; background:rgba(245,166,35,.16); border:2px solid var(--warn); border-radius:16px; padding:16px 18px; margin-bottom:18px; text-align:center; cursor:pointer;">'+
          (chosen==='challenge' ? STAMP_HTML : '')+
          '<div style="color:#C97A12; font-weight:bold; font-size:15px;">🎯 도전할 규칙</div>'+
          challengeInner+
        '</div>'+
        '<button class="cta ghost" id="restart">처음부터 다시</button>'+
      '</div>';

    document.getElementById('choice-can').onclick = function(){
      S.chosenSide = (S.chosenSide === 'can') ? null : 'can';
      pushToDb();
      renderSessionEnd();
    };
    document.getElementById('choice-challenge').onclick = function(){
      S.chosenSide = (S.chosenSide === 'challenge') ? null : 'challenge';
      pushToDb();
      renderSessionEnd();
    };
    document.getElementById('restart').onclick = function(){
      teardownStudentListeners();
      renderRoleSelect();
    };
  }

  function pushToDb(){
    var cfg = getCfg(mySlot);
    if(!db || !mySlot || !cfg) return;
    var lvlIdx = Math.min(S.levelIndex, cfg.levels.length-1);
    var level = cfg.levels[lvlIdx];
    var data = {
      slot: mySlot,
      displayLabel: cfg.label,
      levelIndex: lvlIdx,
      levelTitle: level.title,
      maxLevelIndex: cfg.levels.length - 1,
      canDoIndex: S.canDoIndex,
      canDoTitle: (S.canDoIndex>=0) ? cfg.levels[S.canDoIndex].title : null,
      challengeIndex: (S.challengeIndex==null) ? null : S.challengeIndex,
      challengeTitle: (S.challengeIndex!=null) ? cfg.levels[S.challengeIndex].title : null,
      chosenSide: S.chosenSide || null,
      status: S.status,
      predictionCorrect: S.predictionCorrect,
      predictionTotal: S.predictionTotal,
      boundaryCorrect: S.boundaryCorrect,
      boundaryTotal: S.boundaryTotal,
      log: S.log,
      questionCount: S.questionCount,
      updatedAt: Date.now()
    };
    db.ref('students/'+mySlot).set(data).then(function(){
      dbStatus = 'connected';
    }).catch(function(err){
      dlog('DB 저장 실패: ' + (err && err.message), true);
      dbStatus = 'write-failed';
    });
  }

  function teardownStudentListeners(){
    mySlot = null; S = null;
  }

  /* ================= 교사 대시보드 ================= */
  function renderTeacher(){
    app.innerHTML =
      '<button class="back-link" id="back-role">← 역할 선택으로</button>'+
      '<div class="dash-head">'+
        '<div><h1 class="display" style="margin:0;">🔍 규칙 탐정 실시간 현황판</h1>'+
        '<p>참여한 친구들의 진단 결과를 실시간으로 확인해요</p></div>'+
      '</div>'+
      '<div id="teacher-conn-banner"></div>'+
      '<div class="dash-grid" id="dash-grid"></div>';

    document.getElementById('back-role').onclick = function(){
      teardownTeacherListeners();
      renderRoleSelect();
    };

    renderDashGrid();

    var grid = document.getElementById('dash-grid');
    grid.addEventListener('click', function(e){
      var choiceEl = e.target.closest('.choice-now[data-slot]');
      if(choiceEl){
        toggleChosenSideFromTeacher(choiceEl.getAttribute('data-slot'), choiceEl.getAttribute('data-side'));
        return;
      }
      var row = e.target.closest('.log-item[data-slot]');
      if(!row) return;
      showLogDetail(row.getAttribute('data-slot'), parseInt(row.getAttribute('data-idx'),10));
    });

    function toggleChosenSideFromTeacher(slot, side){
      if(!db || !slot || !side) return;
      var data = teacherCache[slot];
      var current = data ? (data.chosenSide || null) : null;
      var next = (current === side) ? null : side;
      db.ref('students/'+slot).update({ chosenSide: next }).catch(function(err){
        dlog('교사 화면 선택 저장 실패: ' + (err && err.message), true);
      });
    }

    function showTeacherConnBanner(){
      var b = document.getElementById('teacher-conn-banner');
      if(b) b.innerHTML =
        '<div class="banner-help" style="border-color:var(--fail); background:rgba(232,87,74,.12);">'+
        '⚠️ 실시간 연결이 안 되어 있어요. 인터넷 연결 상태를 확인해주세요.'+
        '</div>';
    }

    function setupSubscriptions(d){
      if(!d){ showTeacherConnBanner(); return; }
      db = d;
      var ref = d.ref('students');
      var cb = function(snap){
        teacherCache = snap.exists() ? (snap.val() || {}) : {};
        renderDashGrid();
      };
      ref.on('value', cb, function(){ /* transient errors: keeps retrying internally */ });
      teacherUnsubs.push(function(){ ref.off('value', cb); });
    }

    if(db){
      setupSubscriptions(db);
    } else if(fbDb){
      setupSubscriptions(fbDb);
    } else {
      setupSubscriptions(null);
    }
  }

  function teardownTeacherListeners(){
    teacherUnsubs.forEach(function(u){ try{ u(); }catch(e){} });
    teacherUnsubs = [];
  }

  function showLogDetail(slot, idx){
    var data = teacherCache[slot];
    if(!data || !data.log || !data.log[idx]) return;
    var l = data.log[idx];
    var full = l.fullIcons || [];
    var unitLen = l.unitLength || 0;
    var picked = l.pickedTiles || [];

    var tilesHtml = full.map(function(icon, i){
      var cls = 'modal-tile';
      if(i < unitLen) cls += ' correctgroup';
      if(picked.indexOf(i) !== -1) cls += ' picked';
      return '<div class="'+cls+'">'+icon+'</div>';
    }).join('');

    var predRow = '<div class="modal-row"><span class="tag">예측 결과</span>'+
      (l.predictionOk
        ? '<span class="modal-icon-big">'+(l.correctIcon||'')+'</span>&nbsp; ✅ 정답'
        : '학생 답 <span class="modal-icon-big">'+(l.predictedIcon||'❓')+'</span> ❌ &nbsp;→&nbsp; 정답 <span class="modal-icon-big">'+(l.correctIcon||'')+'</span>')+
      '</div>';

    var boundRow = '<div class="modal-row"><span class="tag">묶음 찾기</span>'+
      (l.boundaryOk ? '✅ 정확히 찾았어요' : '❌ 주황 테두리 = 학생이 고른 조각 · 초록 배경 = 실제 정답 묶음')+
      '</div>';

    var overlay = document.createElement('div');
    overlay.className = 'modal-backdrop';
    overlay.innerHTML =
      '<div class="modal-card">'+
        '<button class="modal-close" id="modal-close-btn">닫기 ✕</button>'+
        '<h3>'+data.displayLabel+' · '+l.level+'</h3>'+
        '<div class="modal-tiles">'+tilesHtml+'</div>'+
        predRow+
        boundRow+
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){
      if(e.target === overlay || e.target.id === 'modal-close-btn'){
        overlay.remove();
      }
    });
  }

  function renderDashGrid(){
    var grid = document.getElementById('dash-grid');
    if(!grid) return;
    var fixedSlots = ['slot1','slot2','slot3'];
    var otherSlots = Object.keys(teacherCache).filter(function(k){
      return fixedSlots.indexOf(k) === -1;
    }).sort(function(a,b){
      var ta = (teacherCache[a] && teacherCache[a].updatedAt) || 0;
      var tb = (teacherCache[b] && teacherCache[b].updatedAt) || 0;
      return ta - tb;
    });
    grid.innerHTML = fixedSlots.concat(otherSlots).map(renderStuCard).join('');
  }

  function renderStuCard(slot){
    var data = teacherCache[slot];
    var cfg = cfgForSlot(slot, data);

    var ladder = '';
    var maxIdx = cfg.levels.length - 1;
    var curIdx = data ? data.levelIndex : 0;
    for(var i=0;i<=maxIdx;i++){
      ladder += '<span class="'+(i<=curIdx ? 'on':'')+'"></span>';
    }

    if(!data){
      return '<div class="stu-card">'+
        '<div class="stu-tab" style="background:'+cfg.accent+'"><span class="name">'+cfg.label+'</span><span>⏳</span></div>'+
        '<div class="stu-body"><p class="empty-note">아직 시작 전이에요</p></div>'+
      '</div>';
    }

    var predPct = data.predictionTotal ? Math.round(100*data.predictionCorrect/data.predictionTotal) : 0;
    var boundPct = data.boundaryTotal ? Math.round(100*data.boundaryCorrect/data.boundaryTotal) : 0;

    var canDoIdx = (typeof data.canDoIndex === 'number') ? data.canDoIndex : -1;
    var canDoLevel = canDoIdx >= 0 ? cfg.levels[canDoIdx] : null;
    var canDoText = canDoLevel ? ruleDisplayHtml(canDoLevel, 18) : '아직 없어요';

    var challengeLevel = (data.challengeIndex === null || data.challengeIndex === undefined)
      ? null
      : cfg.levels[data.challengeIndex];
    var challengeText = challengeLevel
      ? ruleDisplayHtml(challengeLevel, 16)
      : '🎉 최고 단계까지 다 해냈어요!';

    var statusBanner = data.status === 'ended'
      ? '<div class="banner-help">🏁 활동이 종료됐어요. 현재 수준과 도전 과제를 확인해주세요.</div>' : '';

    var logHtml = (data.log||[]).slice(0,5).map(function(l, idx){
      var lvl = findLevelByTitle(cfg, l.level);
      var lvlHtml = lvl ? ruleDisplayHtml(lvl, 15) : l.level;
      return '<div class="log-item log-item-click" data-slot="'+slot+'" data-idx="'+idx+'">'+
        '<span>'+lvlHtml+'</span><span>예측 '+(l.predictionOk?'✅':'❌')+' · 묶음 '+(l.boundaryOk?'✅':'❌')+' <span class="log-arrow">▸</span></span></div>';
    }).join('') || '<div class="log-item"><span>기록 없음</span><span></span></div>';

    return '<div class="stu-card">'+
      '<div class="stu-tab" style="background:'+cfg.accent+'"><span class="name">'+cfg.label+'</span><span>'+((data.levelIndex||0)+1)+'/'+cfg.levels.length+'</span></div>'+
      '<div class="stu-body">'+
        '<div class="ladder">'+ladder+'</div>'+
        '<div class="level-now choice-now" data-slot="'+slot+'" data-side="can" title="눌러서 선택/해제" style="cursor:pointer;">🔍 내가 할 수 있는 규칙: <b>'+canDoText+'</b>'+(data.chosenSide==='can' ? '<span class="pick-stamp">✅ 선택</span>' : '')+'</div>'+
        '<div class="challenge-now choice-now" data-slot="'+slot+'" data-side="challenge" title="눌러서 선택/해제" style="cursor:pointer;">🎯 도전 규칙: '+challengeText+(data.chosenSide==='challenge' ? '<span class="pick-stamp">✅ 선택</span>' : '')+'</div>'+
        statusBanner+
        '<div class="stat-row"><span>예측 정확도</span><b>'+data.predictionCorrect+'/'+data.predictionTotal+' ('+predPct+'%)</b></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+predPct+'%"></div></div>'+
        '<div class="stat-row"><span>묶음 찾기 정확도</span><b>'+data.boundaryCorrect+'/'+data.boundaryTotal+' ('+boundPct+'%)</b></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+boundPct+'%; background:var(--warn);"></div></div>'+
        '<div class="log-title">최근 문제 기록</div>'+
        logHtml+
      '</div>'+
    '</div>';
  }

})();
</script>
</body>
</html>
