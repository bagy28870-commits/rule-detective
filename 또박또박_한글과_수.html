<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>또박또박 한글과 수</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@700;900&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* 깍두기 공책 위 활동지: 단원 → 활동지 목록 → 마당별 활동, 오른쪽에 진행 현황 */
:root{
  --bg:#EEF3F6; --paper:#FFFFFF; --ink:#1B2A3A; --muted:#5A6B7C; --line:#D3DFE8; --soft:#E7EEF4;
  --accent:#2457A5; --accent-ink:#FFFFFF; --hi:#F4C542; --hi-ink:#3A2A00; --pen:#2457A5;
  --ok:#1F8A5A; --bad:#CC433A; --stamp:#D23B33; --guide:#B7C7D4;
  --f-disp:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-glyph:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111920; --paper:#1A2530; --ink:#E6EEF4; --muted:#9DAEBC; --line:#2B3A47; --soft:#22303C;
  --accent:#78A6EE; --accent-ink:#0D1620; --hi:#E5B72E; --hi-ink:#2A1E00; --pen:#8DB5F2;
  --ok:#4CC08A; --bad:#F06A60; --stamp:#F0564C; --guide:#465C6E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111920; --paper:#1A2530; --ink:#E6EEF4; --muted:#9DAEBC; --line:#2B3A47; --soft:#22303C;
  --accent:#78A6EE; --accent-ink:#0D1620; --hi:#E5B72E; --hi-ink:#2A1E00; --pen:#8DB5F2;
  --ok:#4CC08A; --bad:#F06A60; --stamp:#F0564C; --guide:#465C6E; color-scheme:dark }
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-position:-1px -1px;}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:6px 14px}
.brand{font-family:var(--f-disp);font-size:1.6rem;margin-right:auto;background:none;border:0;padding:0;color:var(--ink)}
.brand span{background:linear-gradient(transparent 58%,var(--hi) 58%);padding:0 2px}
.tbtn{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:.95rem}
.tbtn[aria-pressed="false"]{color:var(--muted)}
.paper{background:var(--paper);border:1.5px solid var(--line);border-radius:18px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;text-wrap:balance;margin:0}
/* home */
.hello{padding:18px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hello label{font-family:var(--f-disp);font-size:1.25rem}
.hello input{font:inherit;font-size:1.2rem;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;flex:1 1 160px;max-width:260px}
.subj{display:flex;gap:8px;margin:22px 0 14px}
.subj button{font-family:var(--f-disp);font-size:1.25rem;padding:10px 22px;border-radius:14px;border:2px solid var(--line);background:var(--paper)}
.subj button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.unitcard{text-align:left;padding:20px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.unitcard .un{font-family:var(--f-disp);font-size:1.5rem}
.unitcard .uc{font-size:.85rem;letter-spacing:.06em;color:var(--accent)}
.unitcard .ud{color:var(--muted);font-size:.95rem}
.unitcard:hover{border-color:var(--accent)}
/* board home */
.hello2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hello2 label{font-family:var(--f-disp);font-size:1.15rem}
.hello2 input{font:inherit;font-size:1.1rem;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-width:0;flex:0 1 240px}
.board{background:var(--paper);border:10px solid var(--soft);border-radius:24px;padding:0 20px 34px;box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.bunting{display:flex;gap:6px;margin:0 -14px 14px;height:42px;justify-content:center}
.bunting i{flex:0 0 40px;height:42px;background:var(--c);clip-path:polygon(0 0,100% 0,50% 100%);opacity:.9}
.btitle{text-align:center;font-size:clamp(1.4rem,4vw,2rem);margin:6px 0 18px}
.clips{display:flex;flex-wrap:wrap;gap:34px 26px;justify-content:center;padding-top:12px}
.clip{position:relative;width:210px;padding:14px;border:0;border-radius:20px;background:var(--cc);box-shadow:0 7px 0 color-mix(in srgb,var(--cc) 65%,#000);transition:transform .15s}
.clip::before{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:9px;background:linear-gradient(#E9EDF1,#AEB8C2);border:2px solid #8C97A3;z-index:1}
.clip::after{content:"";position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;border:4px solid #9AA5B0;background:transparent}
.clip:hover,.clip:focus-visible{transform:translateY(-5px) rotate(-1.5deg)}
.csheet{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:210px;padding:30px 10px 18px;background:var(--paper);border-radius:6px}
.ci{font-size:64px;line-height:1}
.cn{font-family:var(--f-disp);font-size:1.6rem;line-height:1.2;text-align:center;text-wrap:balance}
.cb{font-family:var(--f-disp);font-size:.95rem;padding:3px 14px;border-radius:999px;background:var(--cc);color:#fff}
@media (max-width:480px){.clip{width:150px;padding:10px}.csheet{min-height:160px}.ci{font-size:46px}.cn{font-size:1.25rem}.clips{gap:30px 14px}.board{padding:0 10px 24px;border-width:6px}}
.clips.wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 18px}
.clips.wide .clip{width:auto}
.clips.wide .csheet{flex-direction:row;min-height:86px;padding:24px 12px 14px;gap:10px}
.clips.wide .ci{font-size:34px}.clips.wide .cn{font-size:1.3rem}
.clips.wide .cb{background:none;color:var(--muted);padding:0;font-size:.9rem;font-family:var(--f-body)}
.objopt{font-size:clamp(16px,3.6vw,24px)!important;line-height:1.3;letter-spacing:1px}
.pv{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;justify-content:center;max-width:520px}
.pv i{display:block;border:1.5px solid var(--ink);background:var(--hi)}
.pv .o1{width:16px;height:16px}
.pv .t10{width:16px;height:160px;background:repeating-linear-gradient(var(--hi) 0 14.5px,var(--ink) 14.5px 16px)}
.pv .h100{width:96px;height:96px;background:repeating-linear-gradient(90deg,transparent 0 8.4px,var(--ink) 8.4px 9.6px),repeating-linear-gradient(transparent 0 8.4px,var(--ink) 8.4px 9.6px),var(--hi)}
.pv .k1000{width:112px;height:112px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,var(--paper)),color-mix(in srgb,var(--accent) 70%,var(--paper)));display:grid;place-items:center;font-family:var(--f-disp);font-size:1.4rem;color:var(--ink)}
.pvl{display:flex;gap:14px;justify-content:center;font-family:var(--f-disp);color:var(--muted);flex-wrap:wrap}
.grps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:560px}
.grp{border:2.5px dashed var(--accent);border-radius:16px;padding:6px 10px;font-size:30px;line-height:1.2;max-width:150px;text-align:center}
.coins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:520px;align-items:center}
.coin{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:1.05rem;border:3px solid #9C7A2E;background:#E8C766;color:#4A3505}
.coin.c10{background:#D7925A;border-color:#8C5527;color:#3E2008}
.coin.c50,.coin.c100,.coin.c500{background:#D9DEE3;border-color:#8A949E;color:#2C333A}
.coin.c500{width:68px;height:68px}
.bill{width:120px;height:58px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-disp);background:#B9D8A8;border:3px solid #5E8A4A;color:#1F3A14}
.pgraph{display:grid;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:10px 14px}
.pgraph div{display:flex;align-items:center;gap:6px;font-size:28px;min-height:36px}
.pgraph b{font-family:var(--f-disp);font-weight:400;font-size:1rem;width:56px;color:var(--muted)}
.patrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:40px}
.patrow .q{width:52px;height:52px;border:3px dashed var(--accent);border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-size:1.6rem;color:var(--accent)}
.math svg{max-width:100%;height:auto}
.nbig{font-family:var(--f-glyph);font-weight:900;font-size:110px;line-height:1}
.nread{display:flex;flex-direction:column;gap:6px;font-family:var(--f-disp);font-size:2rem;text-align:center}
.nread b{font-weight:400}.nread b+b{border-top:2px solid var(--line);padding-top:6px}
.dotf span{font-size:30px;color:var(--ink)}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mc{background:var(--soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;border:2.5px solid transparent}
.mc.ok{border-color:var(--ok)}
.mc .objs{font-size:34px;min-height:90px;align-content:center}
.nopts{display:flex;gap:8px;justify-content:center}
.nopt{width:56px;height:56px;border-radius:50%;border:3px solid var(--hi);background:var(--paper);font-family:var(--f-disp);font-size:1.6rem}
.nopt.right{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.nopt.wrong{border-color:var(--bad);opacity:.45}.nopt[disabled]{opacity:.35}
.crows{display:flex;flex-direction:column;gap:12px}
.crow{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:16px;padding:10px 14px;border:2.5px solid transparent}
.crow.ok{border-color:var(--ok)}
.cnum{font-family:var(--f-disp);font-size:2.6rem;color:var(--accent);min-width:44px;text-align:center}
.cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;flex:1;min-width:0}
.cell{border:0;background:none;font-size:clamp(26px,5vw,46px);line-height:1;padding:4px 0;min-width:0}
.lgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lg{position:relative;background:var(--soft);border-radius:16px;min-height:200px;display:grid;place-items:center;border:2.5px solid transparent;touch-action:none}
.lg.ok{border-color:var(--ok)}
.litems{display:flex;flex-wrap:wrap;gap:14px 16px;justify-content:center;max-width:300px;font-size:42px;line-height:1;padding:28px 14px}
.lg canvas{position:absolute;inset:0;touch-action:none}
.lok{position:absolute;top:8px;right:12px;color:var(--ok);font-family:var(--f-disp);font-size:1.6rem}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.cust{background:color-mix(in srgb,var(--hi) 14%,var(--paper));border:1.5px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.bub{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-family:var(--f-disp);font-size:1.4rem;line-height:1.4}
.bub b{font-weight:400}.bub em{font-style:normal;color:var(--bad);font-size:2rem}
.who{font-size:96px;line-height:1;justify-self:center}
.basket{grid-column:1/-1;min-height:110px;border:5px solid #B07A3A;border-radius:10px 10px 40px 40px;background:repeating-linear-gradient(45deg,#E2B57B 0 8px,#D3A062 8px 16px);display:flex;flex-wrap:wrap;gap:4px;padding:10px;align-content:flex-start;justify-content:center}
.cust .go{grid-column:1/-1;justify-self:center}
.shelf{background:color-mix(in srgb,#E2B57B 30%,var(--paper));border-radius:18px;padding:0 14px 14px;overflow:hidden}
.awn{height:34px;margin:0 -14px 8px;background:repeating-linear-gradient(90deg,var(--accent) 0 30px,var(--paper) 30px 60px);border-radius:0 0 50% 50%/0 0 30% 30%}
.shelf h4{margin:0 0 8px;text-align:center;font-family:var(--f-disp);font-weight:400;font-size:1.2rem;color:#8A5A20}
.slots2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 4px;padding:10px;border-bottom:10px solid #C98C46;border-top:10px solid #C98C46;background:color-mix(in srgb,#F4D9A8 60%,var(--paper))}
.fr{border:0;background:none;font-size:40px;line-height:1;padding:4px;min-width:0}
.fr.gone{opacity:.15}
.fcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.flc{background:color-mix(in srgb,var(--hi) 14%,var(--paper));border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:12px}
.flp{min-height:240px;border-radius:14px;background:linear-gradient(color-mix(in srgb,var(--accent) 25%,var(--paper)),color-mix(in srgb,var(--accent) 45%,var(--paper)));display:grid;place-items:center;padding:12px}
.flp .objs{font-size:38px}
.peek{border:0;background:var(--paper);border-radius:14px;padding:12px 22px;font-family:var(--f-disp);font-size:1.4rem;color:var(--accent);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 18%,transparent)}
.tool.redpen{color:#C92A2A;border-color:#F0A6A6}
.tool.redpen.on{background:#E03131;color:#fff;border-color:#E03131}
.redn{text-align:center;color:#C92A2A!important;margin:0}
.pt{border:3px solid transparent;border-radius:12px;background:none;font-size:clamp(28px,6vw,40px);line-height:1.1;padding:4px 2px;min-width:0}
.pt.in{background:color-mix(in srgb,var(--hi) 35%,var(--paper));border-color:var(--hi)}
.pt.okg{background:color-mix(in srgb,var(--ok) 18%,var(--paper));border-color:var(--ok)}
.pt.end{box-shadow:6px 0 0 -2px var(--ok)}
.patrow .q.filled{border-style:solid;font-size:34px}
.chip.emo2{font-size:2rem;min-width:64px}
.mybox{background:var(--soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.patrow .ustart{border-left:3px dashed var(--accent);padding-left:4px}
.g100{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));border:2px solid var(--ink);border-radius:6px;width:100%;max-width:520px;font-variant-numeric:tabular-nums}
.g100 span{border:1px solid var(--line);text-align:center;padding:6px 0;font-family:var(--f-disp);font-size:clamp(13px,3.4vw,19px)}
.g100 .hl{background:color-mix(in srgb,var(--accent) 30%,var(--paper))}
.g100 .blank{background:var(--hi);color:var(--hi-ink)}
.bead{--s:64px;--b:#E03131;position:relative;display:inline-block;width:var(--s);height:var(--s);border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.85) 0 9%,rgba(255,255,255,0) 26%),radial-gradient(circle at 50% 55%,var(--b) 55%,color-mix(in srgb,var(--b) 70%,#000) 100%);box-shadow:0 calc(var(--s)*.1) calc(var(--s)*.12) -4px rgba(0,0,0,.25)}
.bead::before{content:"";position:absolute;left:50%;top:5%;width:22%;height:12%;transform:translateX(-50%);border-radius:50%;background:color-mix(in srgb,var(--b) 45%,#000)}
.brow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.bq{width:64px;height:64px;font-size:2rem;display:grid;place-items:center;border:3px dashed var(--hi);border-radius:14px;background:color-mix(in srgb,var(--hi) 22%,var(--paper));font-family:var(--f-disp);color:var(--hi-ink)}
.bopt{display:flex;flex-direction:column;align-items:center;gap:4px}.bopt b{font-family:var(--f-disp);font-weight:400;font-size:1.05rem}
.opt.beadopt{min-height:110px}
.khead{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:14px;align-items:center}
@media (max-width:620px){.khead{grid-template-columns:1fr}}
.kpic{font-size:64px;text-align:center;background:color-mix(in srgb,var(--hi) 22%,var(--paper));border-radius:16px;padding:24px 8px}
.kcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kcard{text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.kcard b{font-family:var(--f-disp);font-weight:400;font-size:1.3rem;color:var(--accent)}.kcard span{font-size:.95rem}
.kcard.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--paper))}
.krow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;background:var(--soft);border-radius:16px;padding:16px}
.krow .brow{flex:1 1 300px}
.madi{display:flex;gap:6px;padding:8px 8px 22px;border:3px dashed var(--accent);border-radius:16px;position:relative}
.madi.m1{border-color:var(--ok)}
.madi i{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-style:normal;font-family:var(--f-disp);font-size:.85rem;color:var(--muted)}
.rule{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:10px}
.rule span{font-family:var(--f-disp);font-size:1.1rem}
.thread{position:relative;padding:18px 40px 18px 10px;border-radius:16px;background:color-mix(in srgb,var(--hi) 12%,var(--paper));overflow-x:auto}
.tline{position:absolute;left:0;right:30px;top:50%;height:4px;background:#B07A3A;border-radius:2px}
.tbeads{position:relative;display:flex;gap:6px;align-items:center;min-width:max-content}
.slotb{width:64px;height:64px;border-radius:50%;border:3px dashed var(--line);background:var(--paper);flex:none}
.knot{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:26px}
.chip.bpick{padding:6px 12px}
.legs{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-family:var(--f-disp);font-size:1.3rem}
.leg{display:flex;align-items:center;gap:6px}
.srow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-family:var(--f-disp);font-size:2.2rem}
.srow span{min-width:48px;text-align:center}
.ebead{display:inline-grid;place-items:center;line-height:1;flex:none}
.kmini{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.kmini span{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:.92rem}.kmini b{font-family:var(--f-disp);font-weight:400;color:var(--accent);margin-right:4px}
.bpt{padding:4px}
.fbk{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-size:1.05rem;line-height:1.55}
.fbk b{font-family:var(--f-disp);font-weight:400;font-size:1.3rem}
.fbk.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--paper))}.fbk.ok b{color:var(--ok)}
.fbk.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--paper))}.fbk.no b{color:var(--bad)}
.nslot{width:62px;height:62px;border-radius:50%;border:3px dashed var(--accent);display:grid;place-items:center;background:var(--paper)}
.nslot em{font-style:normal;font-family:var(--f-disp);font-size:1.4rem;color:var(--accent)}
.slotb.cur{border-color:var(--accent);border-style:solid}
.muted{color:var(--muted)}

.slots.word{border:0;padding:0}
.slot{width:76px;height:76px;border:2px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--f-glyph);font-weight:900;font-size:44px;display:grid;place-items:center}
.slot.empty{color:transparent}
.chip{border:2px solid var(--accent);background:var(--paper);border-radius:12px;padding:10px 16px;font-family:var(--f-disp);font-size:1.5rem;min-height:56px}
.chip.syl{font-family:var(--f-glyph);font-weight:900;font-size:2rem;min-width:64px}

.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.go{border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--f-disp);font-size:1.2rem;border-radius:14px;padding:11px 24px;min-height:52px}
.go.alt{background:var(--soft);color:var(--ink)}
.go[disabled]{opacity:.4;cursor:default}
.go.next.wait{animation:none;background:var(--soft);color:var(--ink)}
.go.next{background:var(--ok);color:var(--accent-ink);font-size:1.45rem;padding:13px 38px;min-height:62px;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.screen{min-width:140px;padding:8px 18px;border:2.5px solid var(--ink);border-radius:12px;font-family:var(--f-disp);font-size:2.6rem;text-align:center;font-variant-numeric:tabular-nums;background:var(--paper);min-height:72px;align-self:center}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;align-self:center}
.pad button{height:64px;border-radius:14px;border:2px solid var(--line);background:var(--paper);font-family:var(--f-disp);font-size:1.8rem}
.pad .ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.3rem}
.findgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:600px;margin:0 auto}
.fcard{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--line);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.fe{font-size:clamp(34px,9vw,58px);line-height:1.1}
.fw{font-family:var(--f-glyph);font-weight:900;font-size:clamp(15px,4vw,24px);line-height:1.2}
.fcard.found{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.fcard.wrong{border-color:var(--bad)}
.praise{position:absolute;top:16px;right:18px;font-family:var(--f-disp);font-size:1.4rem;color:var(--ok);opacity:0;transition:opacity .2s;pointer-events:none}
.praise.on{opacity:1}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bad) 10%,transparent)}
.mdone{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 10px;text-align:center}

.result{padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.stamp{width:170px;height:170px;border:5px solid var(--stamp);border-radius:50%;display:grid;place-items:center;color:var(--stamp);font-family:var(--f-disp);font-size:1.6rem;line-height:1.15;transform:rotate(-12deg);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 6px var(--stamp);animation:stampin .35s ease-out}
.stamp.small{width:120px;height:120px;font-size:1.3rem}

.score{font-family:var(--f-disp);font-size:1.4rem}

.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:400;color:var(--muted);font-size:.85rem;letter-spacing:.04em}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;flex:none}
.pill.g{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.y{background:color-mix(in srgb,var(--hi) 30%,transparent)}
.pill.r{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.note{color:var(--muted);font-size:.92rem;margin:4px 0 0}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}

    <label class="rfl" for="tfplan"><span><b>다음 지도 계획</b> <small>선생님만 보는 메모로, 학습지에는 들어가지 않아요</small></span><textarea id="tfplan" rows="2" placeholder="예: 다음 시간에 AAB 마디를 구체물로 다시 연습">${esc(tf.plan||'')}</textarea></label>
    <div class="acts"><button type="button" class="go" id="tfsave">💾 피드백 저장</button><button type="button" class="go wsmake" id="tfpdf">📝 학습지 제작 (피드백 포함)</button></div>
    <p class="note" id="smsg" style="text-align:center;margin:0">${r.tfb?'저장된 피드백을 불러왔어요.':'피드백을 쓰고 저장을 눌러 주세요.'}</p>
    <div id="tfpages"></div></section>
   <div class="a4wrap" id="tfprev">${sheetHTML(Object.assign({},D,{tfb:tf}))}</div></div>`;
  const collect=()=>({sec:[0,1,2,3].map(k=>$('#tf'+k).value.trim()),all:$('#tfall').value.trim(),plan:$('#tfplan').value.trim(),at:new Date().toISOString()});
  const refresh=()=>{$('#tfprev').innerHTML=sheetHTML(Object.assign({},D,{tfb:collect()}))};
  view.querySelectorAll('.rfform textarea').forEach(t=>t.oninput=refresh);
  $('#bk').onclick=()=>ruleFbList();
  $('#tfsave').onclick=()=>{rfSave(at,collect());$('#smsg').textContent='피드백을 저장했어요.';tone(true)};
  $('#tfpdf').onclick=async()=>{const tfb=collect();rfSave(at,tfb);const msg=$('#smsg');msg.textContent='피드백을 저장하고 학습지를 만들고 있어요…';
    try{const ws=await renderA4($('#tfprev .a4'));$('#tfpages').innerHTML=`<div class="acts"><button type="button" class="go" id="tpdf">📄 PDF로 저장</button><button type="button" class="go alt" id="tpng">🖼️ 그림으로 저장</button></div><div class="wspages">${ws.pages.map((u,k)=>`<figure class="wsp"><img src="${u}" alt="학습지 ${k+1}쪽"><figcaption>${k+1} / ${ws.pages.length}쪽</figcaption></figure>`).join('')}</div>`;
      msg.textContent=`학습지 ${ws.pages.length}쪽을 만들었어요. 저장 버튼을 눌러 주세요.`;$('#tpdf').onclick=()=>saveSheet('pdf',ws,r.name);$('#tpng').onclick=()=>saveSheet('png',ws,r.name)}
    catch(e){msg.textContent=e&&e.message==='lib'?'학습지 만드는 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.':'학습지를 만들지 못했어요. 다시 눌러 주세요.'}};
  window.scrollTo(0,0)}
$('#homeBtn').onclick=home;$('#teacherBtn').onclick=()=>teacher();
home();
</script>
