<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>규칙 탐정 - AI 자기평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F8FF;
    --card:#FFFFFF;
    --ink:#1F2A44;
    --ink-soft:#5A6785;
    --primary:#4C5FD5;
    --primary-ink:#FFFFFF;
    --success:#21B37C;
    --warn:#F5A623;
    --hard:#7C8DE0;
    --fail:#E8574A;
    --border:#DCE3F5;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141826; --card:#1E2436; --ink:#EDF1FF; --ink-soft:#AEB8D6; --border:#2C3352;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141826; --card:#1E2436; --ink:#EDF1FF; --ink-soft:#AEB8D6; --border:#2C3352;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  .display{font-family:'Jua', sans-serif; letter-spacing:0.5px;}
  /* 화면 가운데에 크게: 세로는 가운데 정렬, 큰 화면(전자칠판·PC)에서는 전체를 확대 */
  #app{
    --z:1; zoom:var(--z);
    max-width:1100px; margin:0 auto; padding:24px 16px 40px;
    min-height:calc(100vh / var(--z));
    display:flex; flex-direction:column; justify-content:center;
  }
  /* 배율(--z)은 아래 fit() 스크립트가 화면 크기에 맞춰 자동으로 정해요 (스크롤 없이 한 화면에 보이게) */
  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none; color:var(--ink);}

  /* ---- 역할 선택 ---- */
  .hero{text-align:center; padding:30px 10px 10px;}
  .hero .glass{font-size:56px;}
  .hero h1{font-size:clamp(26px,5vw,38px); margin:8px 0 4px;}
  .hero p{color:var(--ink-soft); margin:0 0 26px; font-size:16px;}
  .role-grid{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); max-width:820px; margin:0 auto;}
  .role-card{
    background:var(--card); border:3px solid var(--border); border-radius:22px;
    padding:26px 18px; text-align:center; transition:transform .15s ease;
  }
  .role-card:active{transform:scale(0.97);}
  .role-card .badge{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-family:'Jua',sans-serif;}
  .role-card h3{margin:4px 0 2px; font-size:20px;}
  .role-card p{margin:0; color:var(--ink-soft); font-size:13px;}
  .role-card.teacher, .role-card.other{border-style:dashed;}

  /* ---- 학생 화면 ---- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
  .topbar .who{display:flex; align-items:center; gap:10px;}
  .who .dot{width:16px;height:16px;border-radius:50%;}
  .topbar h2{margin:0; font-size:22px;}
  .pins{display:flex; gap:8px;}
  .pins span{width:14px;height:14px;border-radius:50%;background:var(--border);}
  .pins span.done{background:var(--success);}
  .pins span.now{background:var(--primary); box-shadow:0 0 0 4px rgba(76,95,213,.25);}
  .conn-badge{display:block; font-size:12px; margin:0 0 12px; padding:2px;}
  .conn-ok{color:var(--success);}
  .conn-wait{color:var(--ink-soft);}
  .conn-bad{color:var(--fail); font-weight:bold;}

  .q-card{
    background:var(--card); border-radius:26px; padding:30px 22px 26px; border:2px dashed var(--border);
    text-align:center; margin-bottom:22px;
  }
  .q-tag{
    display:inline-block; padding:6px 18px; border-radius:999px; background:var(--bg);
    border:2px solid var(--border); font-size:15px; color:var(--ink-soft); margin-bottom:16px;
  }
  .q-text{font-size:clamp(24px,4.2vw,34px); line-height:1.45; margin:0 0 8px;}
  .q-sub{font-size:clamp(20px,3.4vw,28px); line-height:1.45; margin:0 0 6px; color:var(--ink);}
  .q-hint{font-size:16px; color:var(--ink-soft); margin:12px 0 0;}
  .voice-btn{
    background:var(--warn); border:none; border-radius:50%; width:48px; height:48px;
    font-size:22px; margin-top:14px; box-shadow:0 2px 4px rgba(0,0,0,.15);
  }
  .voice-btn:active{transform:scale(0.92);}

  .ans-row{display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  .ans{
    background:var(--card); border:4px solid var(--border); border-radius:26px;
    padding:22px 12px; min-height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .ans:active{transform:scale(0.97);}
  .ans .em{font-size:64px; line-height:1;}
  .ans .lb{font-size:clamp(20px,3vw,26px); font-weight:bold;}
  .ans.sel{border-color:var(--primary); background:rgba(76,95,213,.12); box-shadow:0 0 0 5px rgba(76,95,213,.22);}
  .ans.good.sel{border-color:var(--success); background:rgba(33,179,124,.13); box-shadow:0 0 0 5px rgba(33,179,124,.25);}
  .ans.some.sel{border-color:var(--warn); background:rgba(245,166,35,.15); box-shadow:0 0 0 5px rgba(245,166,35,.28);}
  .ans.hard.sel{border-color:var(--hard); background:rgba(124,141,224,.15); box-shadow:0 0 0 5px rgba(124,141,224,.28);}
  .ans-row.five{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .ans-row.five .ans{min-height:140px;}
  .ans-row.five .ans .em{font-size:52px;}
  .ans.multi{position:relative;}
  .ans.multi .check{
    position:absolute; top:8px; right:10px; width:30px; height:30px; border-radius:50%;
    background:var(--primary); color:#fff; font-size:18px; display:none; align-items:center; justify-content:center;
  }
  .ans.multi.sel .check{display:flex;}
  .ans .sub{font-size:15px; color:var(--ink-soft);}

  .cta-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px;}
  .cta{
    padding:16px 32px; border-radius:18px; border:none; background:var(--primary); color:var(--primary-ink);
    font-size:20px; font-weight:bold;
  }
  .cta.secondary{background:var(--card); color:var(--ink); border:2px solid var(--border);}
  .cta.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border); font-size:15px; padding:10px 18px;}
  .cta:disabled{opacity:.4;}
  .need{color:var(--ink-soft); font-size:15px; text-align:center; min-height:22px; margin-top:12px;}

  /* ---- 마무리 ---- */
  .finish{text-align:center; padding:20px 6px;}
  .finish .big{font-size:72px;}
  .finish h2{font-size:clamp(28px,5vw,40px); margin:6px 0 14px;}
  .summary{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:18px 0;}
  .chip{
    background:var(--card); border:2px solid var(--border); border-radius:999px; padding:9px 18px; font-size:18px;
  }
  .fb-card{
    background:var(--card); border:3px solid var(--success); border-radius:22px; padding:20px 22px;
    max-width:640px; margin:0 auto; text-align:left; font-size:clamp(19px,3vw,24px); line-height:1.6;
  }
  .fb-card p{margin:6px 0;}
  .fb-label{font-family:'Jua',sans-serif; color:var(--success); font-size:15px; margin-bottom:4px; display:block;}

  /* ---- 교사 현황판 ---- */
  .dash-head{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .dash-head p{color:var(--ink-soft); margin:2px 0 0;}
  .dash-grid{display:grid; gap:18px; grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
  .stu-card{background:var(--card); border-radius:20px; overflow:hidden; border:2px solid var(--border);}
  .stu-tab{padding:14px 18px; color:#fff; display:flex; justify-content:space-between; align-items:center;}
  .stu-tab .name{font-family:'Jua',sans-serif; font-size:20px;}
  .stu-tab .state{font-size:13px; background:rgba(255,255,255,.25); padding:4px 12px; border-radius:999px;}
  .stu-body{padding:16px 18px 18px;}
  .row{margin-bottom:14px;}
  .row .tag{font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; display:block;}
  .row .val{font-size:18px; font-weight:bold;}
  .val.none{color:var(--ink-soft); font-weight:normal; font-size:15px;}
  .val.good{color:var(--success);} .val.some{color:#C97A12;} .val.hard{color:var(--hard);}
  .mini-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .mini-chips span{background:var(--bg); border:2px solid var(--border); border-radius:999px; padding:4px 12px; font-size:15px;}
  .mini-chips span.fix{border-color:var(--success); background:rgba(33,179,124,.12);}
  .time{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .back-link{align-self:flex-start; background:none;border:none;color:var(--ink-soft);font-size:14px;margin-bottom:10px;padding:0;}
  .empty-note{color:var(--ink-soft); font-size:14px; text-align:center; padding:6px 4px;}
  .banner-help{
    background:rgba(232,87,74,.12); border:1.5px solid var(--fail); border-radius:12px; padding:10px 14px;
    font-size:14px; margin:10px 0;
  }
</style>
