<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>나만의 규칙 티셔츠 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF7EE; --card:#FFFFFF; --ink:#33261A; --ink-soft:#8A7A68;
    --primary:#FF8A5B; --primary-ink:#FFFFFF; --success:#3AB795; --fail:#E8574A;
    --border:#F0E1CF; --slot-empty:#FDEFDD;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241A12; --card:#33261A; --ink:#FBEFE3; --ink-soft:#C9B39C; --border:#4A3B2A; --slot-empty:#3A2C1C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#241A12; --card:#33261A; --ink:#FBEFE3; --ink-soft:#C9B39C; --border:#4A3B2A; --slot-empty:#3A2C1C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Gowun Dodum',sans-serif; min-height:100vh;}
  .display{font-family:'Jua',sans-serif;}
  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; -webkit-user-select:none;}
  #app{max-width:1400px; margin:0 auto; padding:1.5vh 16px; min-height:100vh; display:flex; flex-direction:column; box-sizing:border-box;}

  .back-link{background:none; border:none; color:var(--ink-soft); font-size:13px; margin-bottom:10px; padding:0; cursor:pointer;}
  .conn-badge{display:inline-block; font-size:12px; padding:4px 10px; border-radius:999px; margin:0 0 10px;}
  .conn-ok{background:rgba(58,183,149,.15); color:var(--success);}
  .conn-bad{background:rgba(232,87,74,.15); color:var(--fail);}
  .teacher-grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-top:10px;}
  .teacher-card{background:var(--card); border:2px solid var(--border); border-radius:18px; padding:16px;}
  .teacher-card .t-name{font-family:'Jua',sans-serif; font-size:18px; margin-bottom:6px;}
  .teacher-card .t-status{font-size:14px; color:var(--ink-soft); line-height:1.6;}
  .teacher-bar{height:10px; border-radius:6px; background:var(--slot-empty); overflow:hidden; margin-top:8px;}
  .teacher-bar-fill{height:100%; background:var(--primary);}
  .t-check{font-size:13px; color:var(--ink-soft); margin-top:8px;}
  .t-check.ok{color:var(--success); font-weight:bold;}
  .teacher-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)) !important;}
  .teacher-card .t-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .teacher-card .t-sec{margin-top:10px;}
  .teacher-card .t-lb{font-size:13px; color:var(--ink-soft); margin-bottom:4px;}
  .teacher-card .t-none{font-size:14px; color:var(--ink-soft); opacity:.8;}
  .teacher-card .t-fmt{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:15px;}
  .teacher-card .t-fmt .fmt-badges{justify-content:flex-start; gap:4px;}
  .teacher-card .t-fmt .fmt-badge{width:28px; height:28px; font-size:16px;}
  canvas.t-cv{display:block; max-width:100%; height:auto;}
  img.t-shirt{display:block; max-width:100%; max-height:150px; margin:10px auto 0; border-radius:12px; background:var(--slot-empty);}
  .hero{position:relative;}
  .hero .voice-btn{
    position:absolute; top:6px; right:6px; width:44px; height:44px; padding:0;
    border:none; border-radius:50%; background:var(--warn,#F4A300); font-size:21px; line-height:1;
    box-shadow:0 2px 4px rgba(0,0,0,.18); cursor:pointer;
  }
  .hero .voice-btn:active{transform:scale(0.92);}
  .hero{text-align:center; padding:clamp(4px,1.2vh,14px) 10px clamp(2px,0.6vh,6px);}
  .hero .brush{font-size:clamp(32px,5.5vh,64px);}
  .hero h1{font-size:clamp(22px,4.4vh,40px); margin:clamp(2px,0.6vh,6px) 0 clamp(2px,0.5vh,4px);}
  .home-center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;}
  .hero p{color:var(--ink-soft); margin:0 0 clamp(6px,1.4vh,16px); font-size:clamp(14px,2vh,20px);}

  .step-dots{display:flex; justify-content:center; gap:8px; margin-bottom:clamp(8px,1.6vh,18px);}
  .step-dots span{width:10px; height:10px; border-radius:50%; background:var(--border);}
  .step-dots span.on{background:var(--primary);}

  .card{background:var(--card); border-radius:24px; padding:clamp(12px,2.6vh,32px) clamp(16px,3vw,32px); border:2px solid var(--border);}
  .step-screen{flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0;}

  .name-grid{display:grid; gap:clamp(12px,2.6vh,28px); grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); max-width:1200px; margin:0 auto;}
  .name-btn{
    background:var(--card); border:4px solid var(--border); border-radius:28px; padding:clamp(14px,3vh,36px) 16px;
    text-align:center; -webkit-appearance:none; appearance:none;
  }
  .name-btn:active{border-color:var(--primary);}
  .name-btn .face{font-size:clamp(38px,6vh,72px); margin-bottom:10px; line-height:1;}
  .name-btn .who{font-family:'Jua',sans-serif; font-size:clamp(18px,2.6vh,30px);}

  .fmt-grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  .fmt-grid-format{display:grid; grid-template-columns:repeat(2, 1fr); gap:14px;}
  .fmt-grid-format .fmt-btn{
    width:100%; min-width:0; min-height:104px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .fmt-btn{
    background:var(--card); border:3px solid var(--border); border-radius:18px; padding:16px;
    text-align:center; -webkit-appearance:none; appearance:none;
  }
  .fmt-btn:active{border-color:var(--primary);}
  .fmt-btn.picked{border-color:var(--primary); background:rgba(255,138,91,.12);}
  .fmt-btn .name{font-family:'Jua',sans-serif; font-size:18px; margin-bottom:8px;}
  .fmt-badges{display:flex; justify-content:center; gap:8px; flex-wrap:wrap;}
  .fmt-badge{
    width:clamp(36px,6vh,56px); height:clamp(36px,6vh,56px); border-radius:14px; background:var(--slot-empty); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-size:clamp(20px,3.4vh,32px); font-weight:bold;
  }
  .fmt-badges-lg{ gap:6px; }
  .fmt-badges-lg .fmt-badge{ width:34px; height:34px; font-size:20px; }
  .fmt-badges-oneline{
    display:flex; flex-wrap:nowrap; align-items:center; justify-content:center;
    overflow-x:auto; overflow-y:hidden; width:100%; -webkit-overflow-scrolling:touch;
  }
  .fmt-badges-oneline .fmt-badge-group{ display:flex; flex-wrap:nowrap; flex:0 0 auto; }
  .fmt-badges-oneline .fmt-badge{ flex:0 0 auto; border-radius:6px; }
  .fmt-badges-oneline .fmt-badge-gap{ flex:0 0 auto; }

  /* 아이콘 한 칸의 크기: 화면 폭이 넓으면 커지고, 좁거나 세로 공간이 부족하면 자동으로 줄어들어서
     한 줄에 8칸이 항상 들어가고, 화면 세로 안에도 다 들어가도록 함
     (8칸 + 간격7개 + 좌우 여백을 뺀 나머지를 8등분 / 세로는 "선택 화면(1줄)" 기준 여유 공간으로 계산) */
  :root{ --icon-size: max(46px, min(140px, calc((100vw - 160px) / 8), calc((100vh - 280px) / 1))); }
  /* 배치 화면은 슬롯 2줄 + 팔레트 1줄, 총 3줄이 한 화면에 들어가야 하므로 별도로 더 작게 계산.
     단, 너무 작아져서 누르기 힘들어지지 않도록 최소 크기(44px)는 지켜줌 — 화면이 아주 작은
     태블릿에서는 이 최소 크기 때문에 살짝 스크롤이 필요할 수 있음 */
  .build-screen{ --icon-size: max(44px, min(140px, calc((100vw - 160px) / 8), calc((100vh - 580px) / 3))); }
  /* ===== 배치 화면: 스크롤 없이 한 화면에 들어오면서 규칙 칸과 그림을 최대한 크게 =====
     --vh 는 실제 보이는 화면 높이(1%)이고 JS가 채움. --cols 는 한 줄 칸 수(JS가 채움).
     세로 계산: 위 제목·규칙 안내·단추 등 약 460px를 빼고 남은 높이를 (칸 2줄 + 그림 0.8줄)=2.8로 나눔 */
  .build-screen{
    --cols: 6;
    --slot-size: max(46px, min(170px, calc((min(100vw, 1400px) - 190px) / var(--cols) - 14px), calc((var(--vh, 1vh) * 100 - 460px) / 2.8)));
    --pal-size: calc(var(--slot-size) * 0.8);
  }
  .build-screen .hero .brush{ display:none; }
  .build-screen .hero{ padding:2px 10px 0; }
  .build-screen .hero h1{ font-size:clamp(20px,3.8vh,30px); margin:0 0 2px; }
  .build-screen .hero p{ font-size:clamp(13px,1.9vh,17px); margin:0 0 4px; }
  .build-screen .fmt-badge{ width:30px; height:30px; font-size:18px; }
  .build-screen .card{ padding:10px clamp(12px,2.4vw,28px); }
  .build-screen .slot{ width:var(--slot-size); height:var(--slot-size); font-size:calc(var(--slot-size) * 0.49); border-radius:22px; }
  .build-screen .slot-row{ gap:14px; margin:6px 0; }
  .build-screen .sgrp{ gap:14px; }
  .build-screen .palette-row{ margin:6px 0; }
  .build-screen .palette-btn{ width:var(--pal-size); height:var(--pal-size); font-size:calc(var(--pal-size) * 0.49); }
  .build-screen .msg{ margin:2px 0; }
  .build-screen .cta-row{ margin-top:6px; }
  .build-screen .home-bottom{ text-align:center; margin-top:8px; }
  .icon-grid{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:clamp(8px,1.6vh,18px) 0;}
  .icon-btn{
    width:var(--icon-size); height:var(--icon-size); border-radius:22px; background:var(--card); border:4px solid var(--border);
    font-size:calc(var(--icon-size) * 0.49); display:flex; align-items:center; justify-content:center; -webkit-appearance:none; appearance:none;
    position:relative;
  }
  .icon-btn.picked{border-color:var(--primary); background:rgba(255,138,91,.12);}
  .icon-btn .tag{
    position:absolute; top:-14px; right:-14px; background:var(--primary); color:#fff; font-family:'Jua',sans-serif;
    width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px;
  }

  .slot-row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:clamp(6px,1.4vh,16px) 0;}
  .slot-break{flex-basis:100%; height:0;}
  /* 묶음 표시: 규칙 한 묶음(unit)을 둥근 테두리로 묶어서 보여 줌 */
  .sgrp{display:flex; gap:10px; padding:6px; border:3px dashed var(--primary); border-radius:26px;}
  .sgrp.c1{border-color:var(--success);}
  .sgrp.c2{border-color:var(--warn);}
  .slot{
    width:var(--icon-size); height:var(--icon-size); border-radius:20px; background:var(--slot-empty); border:4px dashed var(--border);
    display:flex; align-items:center; justify-content:center; font-size:calc(var(--icon-size) * 0.49);
  }
  .slot.filled{border-style:solid; border-color:var(--primary);}
  .slot.correct{border-color:var(--success); background:rgba(58,183,149,.15);}
  .slot.wrong{border-color:var(--fail); background:rgba(232,87,74,.15);}

  .palette-row{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:clamp(6px,1.2vh,14px) 0;}
  .palette-btn{
    width:var(--icon-size); height:var(--icon-size); border-radius:20px; background:var(--card); border:4px solid var(--border);
    font-size:calc(var(--icon-size) * 0.49); display:flex; align-items:center; justify-content:center; -webkit-appearance:none; appearance:none;
  }
  .palette-btn:disabled{opacity:.35;}

  .cta-row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:clamp(6px,1.4vh,16px);}
  .cta{
    padding:clamp(10px,1.6vh,18px) clamp(20px,3vw,34px); border-radius:16px; border:none; background:var(--primary); color:var(--primary-ink);
    font-size:clamp(14px,1.9vh,19px); font-weight:bold;
  }
  .cta.secondary{background:var(--card); color:var(--ink); border:2px solid var(--border);}
  .cta.ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border); font-size:13px; padding:8px 16px;}
  .cta:disabled{opacity:.4;}
  .cta.pulse{animation:ctaPulse 1.4s ease-in-out infinite;}
  @keyframes ctaPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

  .msg{text-align:center; font-size:clamp(13px,1.7vh,18px); color:var(--ink-soft); margin:clamp(4px,0.8vh,10px) 0 4px;}
  .msg.ok{color:var(--success); font-weight:bold;}
  .msg.bad{color:var(--fail); font-weight:bold;}
  .reset-row{text-align:center; margin-top:clamp(8px,1.6vh,18px);}
  .pw-backdrop{position:fixed; inset:0; background:rgba(40,28,20,.55); display:flex; align-items:center; justify-content:center; z-index:10000; padding:20px;}
  .pw-card{background:var(--card); border-radius:22px; padding:24px; max-width:380px; width:100%; text-align:center; box-sizing:border-box;}
  .pw-card h3{margin:0 0 8px; font-size:22px;}
  .pw-card p{margin:0 0 6px; color:var(--ink-soft); font-size:15px;}
  .pw-input{width:100%; padding:14px; border-radius:14px; border:3px solid var(--border); font-size:26px; text-align:center;
    letter-spacing:8px; font-family:inherit; background:var(--card); color:var(--ink); box-sizing:border-box; margin:10px 0 4px;}
  .pw-err{color:var(--fail); font-weight:bold; font-size:15px; min-height:22px; text-align:center;}
  .pw-btns{display:flex; gap:12px; justify-content:center; margin-top:10px;}

  .preview-strip{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap; background:var(--slot-empty);
    border-radius:16px; padding:14px; margin:14px 0;
  }
  .preview-strip span{font-size:30px; display:inline-flex; width:32px; height:32px; align-items:center; justify-content:center;}

  .note-box{
    background:var(--slot-empty); border-radius:16px; padding:clamp(8px,1.6vh,16px); font-size:clamp(12px,1.6vh,14px); color:var(--ink-soft);
    margin-top:clamp(8px,1.6vh,18px); line-height:1.5;
  }

  #photo-canvas{
    display:block; margin:0 auto; max-width:100%; border-radius:16px; border:2px solid var(--border);
    touch-action:none; background:var(--slot-empty);
  }
  .upload-box{
    border:3px dashed var(--border); border-radius:18px; padding:30px; text-align:center; color:var(--ink-soft);
  }
  .upload-box input{margin-top:10px;}

  .fashion-stage{
    background: radial-gradient(circle at 50% 0%, #4a2f6b 0%, #1a0f2e 55%, #0d0618 100%);
    border-radius: 24px; padding: 30px 20px 16px; text-align:center; color:#fff;
    position:relative; overflow:hidden;
    flex:1; display:flex; flex-direction:column; min-height:0;
  }
  .fashion-sparkles{ font-size:16px; letter-spacing:10px; opacity:.85; margin-bottom:2px; }
  .fashion-title{ color:#FFD97D; margin:0 0 clamp(10px,2vh,22px); font-size:clamp(18px,3.4vh,26px); }
  .fashion-grid{ display:flex; gap:40px; justify-content:center; align-content:center; flex-wrap:wrap; flex:1; }
  .fashion-card{ position:relative; width:min(380px, 30vw, 40vh, 86vw); }
  .fashion-card.clickable{ cursor:pointer; transition:transform .15s; }
  .fashion-card.clickable:active{ transform:scale(.96); }
  .fashion-lightbox{
    position:fixed; inset:0; background:rgba(5,2,12,.92); z-index:1000;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px;
  }
  .fashion-lightbox img{
    max-width:min(640px, 92vw); max-height:72vh; border-radius:22px;
    border:5px solid #FFD97D; box-shadow:0 0 50px rgba(255,217,125,.6); display:block;
  }
  .fashion-lightbox .lb-name{ color:#FFD97D; font-family:'Jua',sans-serif; font-size:26px; }
  .fashion-lightbox .lb-close{
    position:absolute; top:18px; right:18px; width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,.15); color:#fff; border:none; font-size:22px; cursor:pointer;
  }
  .fashion-lightbox .lb-pdf-btn{
    background:#FFD97D; color:#3a2a10; border:none; border-radius:999px; padding:14px 28px;
    font-family:'Jua',sans-serif; font-size:17px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.3);
  }
  .fashion-lightbox .lb-pdf-btn:active{ transform:scale(.97); }
  .spotlight{
    position:absolute; top:-40px; left:50%; transform:translateX(-50%);
    width:135%; aspect-ratio:1; border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 70%);
    z-index:0; pointer-events:none;
  }
  .fashion-photo{
    position:relative; z-index:1; width:100%; display:block; border-radius:20px;
    border:4px solid #FFD97D; box-shadow: 0 0 40px rgba(255,217,125,.55);
  }
  .fashion-empty{
    position:relative; z-index:1; width:100%; aspect-ratio:3/4; border-radius:20px;
    border:3px dashed rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,.65); font-size:20px; text-align:center; padding:10px;
  }
  .fashion-name{ position:relative; z-index:1; margin-top:16px; font-family:'Jua',sans-serif; font-size:30px; }
  .runway-floor{
    height:20px; margin-top:28px; border-radius:0 0 18px 18px;
    background: repeating-linear-gradient(45deg, #FFD97D 0 12px, #FF8A5B 12px 24px);
  }
</style>
</head>
